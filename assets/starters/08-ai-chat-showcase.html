<style>
:root{--bg:#0b0b0c;--fg:#f2f5f2;--muted:#9aa19c;--accent:#58f38e;--accent2:#ff3d7f;--card:#1c1d20;--line:#2e3034;
  --font:'Inter Tight','Noto Sans Thai',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%;background:#000;color:var(--fg);font-family:var(--font)}
.player{max-width:1280px;margin:0 auto;padding:16px}
.screen{position:relative;width:100%;margin:0 auto;background:#000;overflow:hidden;border-radius:14px}
.screen.ffs{position:fixed;inset:0;z-index:99;width:auto!important;max-width:none!important;border-radius:0;aspect-ratio:auto!important}
.screen.ffs.rot{inset:auto;left:50%;top:50%;width:100vh!important;height:100vw;transform:translate(-50%,-50%) rotate(90deg)}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--bg);color:var(--fg)}
.scene{position:absolute;inset:0;visibility:hidden;overflow:hidden}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
/* alpha export (scripts/render.js --alpha): every background goes transparent */
html.alpha,html.alpha body,html.alpha .screen,html.alpha .stage,html.alpha .scene{background:transparent!important}
.controls{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-top:12px}
.controls button,.controls select,.chapters button{background:#1c1d20;color:#f2f5f2;border:1px solid #2e3034;border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.rail{flex:1 1 200px;height:8px;background:#2a2b2f;border-radius:4px;position:relative;cursor:pointer;touch-action:none}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);border-radius:4px}
#time,#meter{font-variant-numeric:tabular-nums;font-size:14px;color:#f2f5f2}
#meter{color:#9aa19c;min-width:56px}
.chapters{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hint{margin-top:10px;color:#9aa19c;font-size:12px}
/* smear + RGB split, driven by two CSS variables (no blur filter) */
.fx{--s:0;--r:0;text-shadow:
  calc(var(--s) * -1px) 0 0 color-mix(in srgb, currentColor 40%, transparent),
  calc(var(--s) * -2px) 0 0 color-mix(in srgb, currentColor 22%, transparent),
  calc(var(--s) * -3.2px) 0 0 color-mix(in srgb, currentColor 10%, transparent),
  calc(var(--r) * 1px) 0 0 rgba(255,61,127,.75),
  calc(var(--r) * -1px) 0 0 rgba(61,200,255,.65)}
/* the same glitch "jammed" in brand colours instead of red / cyan (text-fx.md) */
.fxg{--s:0;--r:0;--ga:color-mix(in srgb, var(--accent) 90%, white);--gb:color-mix(in srgb, var(--accent) 45%, black);text-shadow:
  calc(var(--s) * -1px) 0 0 color-mix(in srgb, currentColor 40%, transparent),
  calc(var(--s) * -2px) 0 0 color-mix(in srgb, currentColor 22%, transparent),
  calc(var(--s) * -3.2px) 0 0 color-mix(in srgb, currentColor 10%, transparent),
  calc(var(--r) * 1px) calc(var(--r) * -.3px) 0 var(--ga),
  calc(var(--r) * -1px) calc(var(--r) * .3px) 0 var(--gb)}
/* captions (burned in; also exported as .srt by scripts/render.js) */
/* three looks (CONFIG.ccStyle or ?cc=): box = dark box · clean = white text with a dark edge, no box · bar = brand-colour bar */
#cc{position:absolute;left:0;right:0;z-index:40;display:flex;justify-content:center;pointer-events:none}
#cc span{color:#fff;font-weight:700;line-height:1.25;text-align:center;max-width:86%;text-wrap:balance}
#cc.box span{background:rgba(0,0,0,.72);border-radius:.35em;padding:.18em .55em}
#cc.clean span{font-weight:800;text-shadow:0 0 .12em #000,0 0 .12em #000,0 .06em .3em rgba(0,0,0,.85)}
#cc.bar span{background:var(--accent);color:var(--bg);font-weight:800;border-radius:.2em;padding:.16em .6em}
#cc.off,#cc:empty{display:none}
/* safe-zone overlay: preview only, never rendered */
#safe{position:absolute;inset:0;z-index:60;pointer-events:none;display:none}
#safe i{position:absolute;background:rgba(255,40,80,.28);outline:2px dashed rgba(255,60,90,.9);outline-offset:-2px}
#safe b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;background:rgba(255,40,80,.85);font:700 28px/1.2 system-ui;padding:6px 14px;border-radius:8px}
/* ---- scene styles: sizes are set from JS relative to the frame (M = short side) ---- */
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mask{overflow:hidden;padding:.14em .08em .04em}
.mask>span{display:inline-block}
.word{font-weight:var(--weight,900);line-height:1.05;letter-spacing:var(--track,-.02em)}
.tag{font-weight:500;color:var(--muted)}
.card{position:absolute;border-radius:var(--radius,6%/4.6%);background:var(--card);border:2px solid var(--line);display:flex;flex-direction:column;color:var(--cardfg,var(--fg))}
.card .name{font-weight:700}
.card .price{font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums}
.card ul{list-style:none;padding:0;margin-top:auto}
.card li{display:flex;align-items:center;gap:.5em;font-weight:500}
.card .tk{display:inline-grid;place-items:center;width:1.3em;height:1.3em;border-radius:50%;background:var(--accent);color:var(--bg);font-weight:900;font-size:.8em}
</style>

<body>
<div class="player">
  <div class="screen" id="screen"><div class="stage" id="stage">
    <div id="bgL" style="position:absolute;inset:0;z-index:0"></div>
    <div id="bgD" style="position:absolute;inset:0;z-index:0"></div>
    <div id="edges" style="position:absolute;inset:0;z-index:0;pointer-events:none"></div>
    <canvas id="pcv" style="position:absolute;left:0;top:0;z-index:1;pointer-events:none"></canvas>
    <section class="scene" id="s1" style="z-index:2;background:transparent"></section>
    <section class="scene" id="s2" style="z-index:3;background:transparent"></section>
    <section class="scene" id="s3" style="z-index:3;background:transparent"></section>
    <div id="black" style="position:absolute;inset:0;z-index:34;background:#000;visibility:hidden;pointer-events:none"></div>
    <div id="orb" style="position:absolute;z-index:30;visibility:hidden;border-radius:50%;pointer-events:none;background:radial-gradient(circle,#fff6ee 0%,rgba(242,179,143,.85) 22%,rgba(224,120,79,.35) 48%,rgba(224,120,79,0) 70%)"></div>
    <div id="cc"></div>
    <div id="safe"></div>
  </div></div>
  <div class="controls">
    <button id="play">Play</button><span id="time">0:00 / 0:00</span>
    <div class="rail" id="rail"><div class="fill" id="fill"></div></div>
    <select id="fps" aria-label="frame rate">
      <option value="120">120 fps</option><option value="60">60 fps</option><option value="30">30 fps</option><option value="24">24 fps</option>
    </select><span id="meter">– fps</span>
    <button id="mus">Music on</button><button id="sfx">SFX on</button><button id="ccb">CC on</button>
    <select id="safeSel" aria-label="safe zone"><option value="">Safe zone: off</option><option value="all">All platforms</option><option value="tiktok">TikTok</option><option value="reels">IG Reels</option><option value="shorts">YT Shorts</option></select>
    <button id="fs">Fullscreen</button>
  </div>
  <nav class="chapters" id="chapters"></nav>
  <p class="hint">Space play/pause · ←/→ 1 s · Home restart · F fullscreen · M music · S effects · C subtitles · Z safe zone</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const qs = new URLSearchParams(location.search);

/* ---------- 1. settings: ask the user first, then fill these in ---------- */
const CONFIG = {
  aspect: '16:9', fps: 120, style: 'dark',
  brand: {bg:'#121110', fg:'#F4F1EA', muted:'#A39E93', accent:'#E0784F', accent2:'#F2B38F', card:'#1E1C1A', line:'#34302C',
          font:"'Inter Tight','IBM Plex Sans Thai',system-ui,sans-serif"},
  bpm: null, music: null, songStart: 0, beats: null, bars: null, songFade: 0.8,
  bed: 'full', mood: 'cinematic',
  captions: true, ccStyle: 'box', ccPos: 'bottom', safeZone: ''
};
// music moods: tempo, one chord per bar, drum / bass / chord / lead styles (references/sound.md › Music moods)
const MOODS = {
  drive:     {bpm:120, prog:'Am F C G',             drums:'four',    bass:'off8',   chords:'pad',   lead:null,      swing:0},     // punchy modern promo (default)
  hype:      {bpm:128, prog:'Fm Db Ab Eb',          drums:'four',    bass:'roll',   chords:'pad',   lead:'arp',     swing:0},     // concerts, events, launches
  anthem:    {bpm:100, prog:'C G Am F',             drums:'half',    bass:'long',   chords:'pad',   lead:'chime',   swing:0},     // big, uplifting, stadium
  cinematic: {bpm:90,  prog:'Dm Bb F C',            drums:'boom',    bass:'sub',    chords:'pad',   lead:'chime',   swing:0},     // trailers, reveals, tension
  cafe:      {bpm:92,  prog:'Dm7 G7 Cmaj7 Am7',     drums:'brush',   bass:'walk',   chords:'keys',  lead:null,      swing:0.33},  // restaurants, coffee, jazz
  sunny:     {bpm:112, prog:'C F G C',              drums:'clapfun', bass:'bounce', chords:'soft',  lead:'uke',     swing:0.2},   // happy, fresh food, summer
  cute:      {bpm:118, prog:'F C Dm Bb',            drums:'tiny',    bass:'bounce', chords:'soft',  lead:'marimba', swing:0.2},   // pets, kids, cute things
  lofi:      {bpm:80,  prog:'Fmaj7 Em7 Dm7 Cmaj7',  drums:'lazy',    bass:'long',   chords:'keys',  lead:null,      swing:0.4},   // cosy, calm, study, wellness
  clean:     {bpm:108, prog:'C Am F G',             drums:'soft',    bass:'off8',   chords:'soft',  lead:'arp',     swing:0},     // corporate, SaaS, back-office, trust
  luxe:      {bpm:86,  prog:'Cm9 Abmaj7 Fm9 G7sus', drums:'sparse',  bass:'sub',    chords:'soft',  lead:null,      swing:0}      // premium, beauty, fashion, finance
};
if (qs.get('mood')) { CONFIG.mood = qs.get('mood'); CONFIG.bed = CONFIG.bed || 'full'; }      // ?mood=cute previews any mood on any clip
const MOOD = MOODS[CONFIG.mood] || MOODS.drive;
if (!CONFIG.bpm && !CONFIG.beats) CONFIG.bpm = MOOD.bpm;
const SIZES = { '16:9':[1920,1080], '21:9':[2520,1080], '9:16':[1080,1920], '4:3':[1440,1080], '3:4':[1080,1440] };
const [W, H] = SIZES[qs.get('aspect') || CONFIG.aspect] || SIZES['16:9'];
const M = Math.min(W, H);                      // size everything from the short side so every aspect works
const VERT = H > W;
const px = v => Math.round(v) + 'px';
// beat -> seconds. With the user's song: the song's own beats (from beats.js), shifted so the clip starts at songStart
const BT = CONFIG.beats ? CONFIG.beats.map(t => t - CONFIG.songStart).filter(t => t > -0.02) : null;
if (BT && BT.length > 1 && !CONFIG.bpm) CONFIG.bpm = 60 / ((BT[BT.length - 1] - BT[0]) / (BT.length - 1));
const B = n => {
  if (!BT || BT.length < 2) return n * 60 / CONFIG.bpm;
  const L = BT.length - 1, i = Math.floor(n);
  if (i < 0) return BT[0] + n * (BT[1] - BT[0]);
  if (i >= L) return BT[L] + (n - L) * (BT[L] - BT[L - 1]);
  return BT[i] + (n - i) * (BT[i + 1] - BT[i]);
};
const BAR0 = BT && CONFIG.bars ? Math.max(0, BT.findIndex(t => CONFIG.bars.some(b => Math.abs(b - CONFIG.songStart - t) < 0.03))) : 0;
const BAR = n => B(BAR0 + 4 * n);               // start of bar n (4 beats per bar)

/* ---------- 2. look (shapes, type, motion feel) + brand colours (references/styles.md) ---------- */
// pal = the look's own colours (cardfg = text on cards, when it differs from fg), used when the project has no brand colours. Eases: pop = small things landing,
// enter = pieces arriving, move = camera / whip-pans, out = pieces leaving. Shots use LOOK.* so a look change re-times the feel.
const LOOKS = {
  dark:   {pal:{bg:'#0b0b0c', fg:'#f2f5f2', muted:'#9aa19c', accent:'#58f38e', accent2:'#ff3d7f', card:'#1c1d20', line:'#2e3034'},
           radius:'6%/4.6%', weight:900, track:'-.02em',  pop:'back.out(1.6)', enter:'back.out(1.3)', move:'expo.inOut',   out:'power3.in'},
  light:  {pal:{bg:'#f4f5f2', fg:'#111214', muted:'#6b716d', accent:'#1f5eff', accent2:'#ff4d2e', card:'#ffffff', line:'#dfe2dd'},
           radius:'5%/3.8%', weight:800, track:'-.015em', pop:'back.out(1.3)', enter:'power3.out',    move:'power3.inOut', out:'power2.in'},
  poster: {pal:{bg:'#ff4d2e', fg:'#111214', muted:'#3a1a12', accent:'#fff2d6', accent2:'#1f3cff', card:'#111214', cardfg:'#fff2d6', line:'#111214'},
           radius:'0',        weight:900, track:'-.035em', pop:'back.out(1.2)', enter:'power4.out',    move:'power4.inOut', out:'power4.in'},
  pastel: {pal:{bg:'#fdf1f5', fg:'#2b2233', muted:'#8a7a90', accent:'#7c5cff', accent2:'#ff8fb1', card:'#ffffff', line:'#efd9e3'},
           radius:'12%/9%',   weight:800, track:'-.01em',  pop:'back.out(2.4)', enter:'back.out(2)',   move:'sine.inOut',   out:'back.in(1.6)'}
};
const OLDBRAND = typeof CONFIG.style === 'object' ? CONFIG.style : null;             // older clips: CONFIG.style = {brand colours}
const lightBg = c => { const n = parseInt(String(c).replace('#', '').slice(0, 6), 16); return ((n >> 16) * 0.3 + (n >> 8 & 255) * 0.59 + (n & 255) * 0.11) > 140; };
const LOOK = LOOKS[qs.get('style') || (OLDBRAND ? (lightBg(OLDBRAND.bg) ? 'light' : 'dark') : CONFIG.style)] || LOOKS.dark;
const BRAND = qs.get('brand') === 'off' ? null : (CONFIG.brand || OLDBRAND);         // ?brand=off previews the look's own colours
function applyStyle(){
  const pal = {...LOOK.pal, ...(BRAND || {})}, root = document.documentElement.style;
  for (const k in pal) if (typeof pal[k] === 'string' && k !== 'font') root.setProperty('--' + k, pal[k]);
  if (pal.font) root.setProperty('--font', pal.font);
  root.setProperty('--radius', LOOK.radius); root.setProperty('--weight', LOOK.weight); root.setProperty('--track', LOOK.track);
}
applyStyle();
if (qs.has('alpha')) document.documentElement.classList.add('alpha');

/* ---------- 3. fit the fixed stage into the screen (letterbox) ---------- */
const stage = $('#stage'), screen = $('#screen');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
screen.style.aspectRatio = W + ' / ' + H;
screen.style.maxWidth = `calc(78vh * ${W / H})`;           // portrait clips stay inside the window on desktop
function fit(){
  const w = screen.clientWidth, h = screen.clientHeight, s = Math.min(w / W, h / H);
  stage.style.transform = `translate(${(w - W * s) / 2}px,${(h - H * s) / 2}px) scale(${s})`;
}
new ResizeObserver(fit).observe(screen); fit();

/* ---------- 4. camera helpers ---------- */
const cam = (cx, cy, s) => ({ x: W / 2 - cx * s, y: H / 2 - cy * s, scale: s });                // world point -> frame centre
const camAt = (cx, cy, s, sx, sy) => ({ x: sx - cx * s, y: sy - cy * s, scale: s });           // world point -> screen point

/* ---------- 5. sound: synthesized palette + the user's sound files, on a master bus (references/sound.md) ---------- */
let ac = null, bus = null, verb = null, NB = null, GR = null, grp = 'sfx';
const ON = { music:true, sfx:true };                                     // two groups, muted separately (buttons + M / S keys)
const MUSIC = new Set(['kick', 'hat', 'clap', 'snare', 'rim', 'shaker', 'tom', 'crash', 'bass', 'sub', 'pad', 'softpad', 'keys', 'pluck', 'marimba', 'uke', 'chime']);
const groupOf = type => MUSIC.has(type) ? 'music' : 'sfx';
function makeBus(ctx){                                                   // warm low shelf -> tamed highs -> glue compressor -> master, + small room reverb
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 3.5; comp.attack.value = 0.005; comp.release.value = 0.2;
  const warm = ctx.createBiquadFilter(); warm.type = 'lowshelf'; warm.frequency.value = 80; warm.gain.value = 2;
  const tame = ctx.createBiquadFilter(); tame.type = 'highshelf'; tame.frequency.value = 6000; tame.gain.value = -1;
  const master = ctx.createGain(); master.gain.value = 0.8;
  const b = ctx.createGain(); b.connect(warm); warm.connect(tame); tame.connect(comp); comp.connect(master); master.connect(ctx.destination);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 1073741823.5 - 1;   // seeded: same noise every render
  const len = ctx.sampleRate * 2.2 | 0, ir = ctx.createBuffer(2, len, ctx.sampleRate);
  for (let c = 0; c < 2; c++){ const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = rnd() * Math.pow(1 - i / len, 3.2); }
  const v = ctx.createConvolver(); v.buffer = ir; const vg = ctx.createGain(); vg.gain.value = 0.32; v.connect(vg); vg.connect(b);
  const n = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), nd = n.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = rnd();
  const G = {}; ['music', 'sfx'].forEach(k => { const dry = ctx.createGain(), wet = ctx.createGain(); dry.connect(b); wet.connect(v); G[k] = {dry, wet}; });
  return {bus:b, verb:v, NB:n, GR:G};
}
function useCtx(ctx){ ac = ctx; ({bus, verb, NB, GR} = makeBus(ctx)); }
function applyMute(){ if (!GR) return; const now = ac.currentTime; for (const k in GR) ['dry', 'wet'].forEach(x => { const g = GR[k][x].gain; g.cancelScheduledValues(now); g.setTargetAtTime(ON[k] ? 1 : 0, now, 0.03); }); }
function ensureAudio(){ if (!ac){ useCtx(new (window.AudioContext || window.webkitAudioContext)()); applyMute(); } if (ac.state === 'suspended') ac.resume(); }
function out(send = 0){ const G = GR[grp], g = ac.createGain(); g.connect(G.dry); if (send){ const s = ac.createGain(); s.gain.value = send; g.connect(s); s.connect(G.wet); } return g; }
function tone(type, f0, f1, t, d, v, o = {}){                            // o: a (attack), glide, lp, q, detune, send
  const osc = ac.createOscillator(), g = out(o.send || 0); let node = osc;
  osc.type = type; osc.frequency.setValueAtTime(f0, t); osc.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + (o.glide || d));
  if (o.detune) osc.detune.value = o.detune;
  if (o.lp){ const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; f.Q.value = o.q || 0.7; node.connect(f); node = f; }
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + (o.a || 0.006)); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  node.connect(g); osc.start(t); osc.stop(t + d + 0.05);
}
function noise(t, d, v, f0, f1, q = 1, o = {}){                         // o: type (bandpass | lowpass | highpass), peak (0-1 of d), send
  const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = out(o.send || 0);
  src.buffer = NB; f.type = o.type || 'bandpass'; f.Q.value = q;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + Math.max(0.003, d * (o.peak == null ? 0.4 : o.peak))); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  src.connect(f); f.connect(g); src.start(t, (t * 7.31) % 1); src.stop(t + d + 0.02);
}
function bell(t, f, d, v, send = 0.45){                                  // soft FM bell: rounder than a pure sine
  const c = ac.createOscillator(), m = ac.createOscillator(), mg = ac.createGain(), g = out(send);
  c.frequency.value = f; m.frequency.value = f * 1.41; mg.gain.setValueAtTime(f * 1.2, t); mg.gain.exponentialRampToValueAtTime(1, t + d * 0.6);
  m.connect(mg); mg.connect(c.frequency); c.connect(g);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  c.start(t); m.start(t); c.stop(t + d + 0.05); m.stop(t + d + 0.05);
}
// the user's sound files: put {"name": "<base64 mp3>"} in <script type="application/json" id="sfxdata">; play with sfx(t, 'name', vol)
const SAMP = {};
const sampReady = (() => { const el = document.getElementById('sfxdata'); if (!el) return Promise.resolve(); const data = JSON.parse(el.textContent || '{}');
  return Promise.all(Object.entries(data).map(([k, b64]) => { const bin = atob(b64), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return new OfflineAudioContext(1, 1, 44100).decodeAudioData(u.buffer).then(b => { SAMP[k] = b; }).catch(() => {}); })); })();
function samp(n, t, v = 0.7, o = {}){ if (!SAMP[n]) return; const src = ac.createBufferSource(), g = out(o.send || 0); src.buffer = SAMP[n]; src.playbackRate.value = o.rate || 1; g.gain.value = v; src.connect(g); src.start(Math.max(ac.currentTime, t), o.offset || 0); }
// the pitched palette lives on an A-minor pentatonic, low enough not to pierce; one timbre per kind of action
const hash01 = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };   // repeatable 0–1 noise: same value every render
const PENTA = [440, 523, 587, 659, 784, 880, 1047, 1175, 1319, 1568, 1760];
const SFX = {

function play(type, t, arg){ grp = groupOf(type); SFX[type](t, ...(arg && arg.args ? arg.args : [arg])); }   // cue(t, type, {args:[a, b]}) for several arguments
const CUES = [];
const AUTO = { tick:[1, 3, 5, 2, 4, 6, 3, 7, 5, 4].map(i => PENTA[i]), pop:[480, 600, 540, 720, 640, 560], softpop:[330, 392, 440, 494, 523], ding:[880, 784, 1047, 1175, 880, 1319] }, autoN = {};
function cue(t, type, arg){                                             // pitched cues without an arg walk the scale: never the same note twice in a row
  if (arg == null && AUTO[type]){ const n = autoN[type] = (autoN[type] || 0) + 1; arg = AUTO[type][(n - 1) % AUTO[type].length]; }
  const c = {t, type, arg}; CUES.push(c); return c;                      // cue(...).late = 0.05 delays just that one sound
}
const sfx = (t, n, v = 0.7, o = {}) => cue(t, 'sample', {n, v, ...o});
const LATE = { key:0.05 };                                               // per-sound delay in seconds, tuned by ear (references/sound.md › Sync)
const HUSH = [];                                                         // [from, to] windows with no drums: breaths before big hits, the logo ending
const NOTE = {A:0, B:2, C:3, D:5, E:7, F:8, G:10};                         // semitones from A
const QUAL = {'':[0, 4, 7], m:[0, 3, 7], '7':[0, 4, 7, 10], maj7:[0, 4, 7, 11], m7:[0, 3, 7, 10], m9:[0, 3, 7, 10, 14], '7sus':[0, 5, 7, 10], sus:[0, 5, 7], add9:[0, 4, 7, 14], '6':[0, 4, 7, 9]};
function chordOf(name){                                                  // 'Dm7' -> bass root (39–78 Hz) + pad voicing (170–440 Hz)
  const m = name.match(/^([A-G])([#b]?)(.*)$/); let n = (NOTE[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + 12) % 12; if (n > 6) n -= 12;
  const root = 55 * Math.pow(2, n / 12);
  const tones = (QUAL[m[3]] || QUAL['']).map(i => { let f = root * 4 * Math.pow(2, i / 12); while (f >= 440) f /= 2; while (f < 170) f *= 2; return f; }).sort((a, b) => a - b);
  return {root, tones};
}
function musicPlan(){                                                   // one entry per shot, from chapter(t, name, {e, peak, end})
  const ch = CHAPTERS.slice().sort((a, b) => a.t - b.t); if (!ch.length) ch.push({t:0, n:''});
  const set = ch.some(c => c.e != null), last = ch.length - 1;
  return ch.map((c, i) => ({ sb: Math.round(c.t / B(1) * 2) / 2, peak: !!c.peak,
    end: c.end != null ? !!c.end : (i === last && i > 1 && /logo|outro|end|โลโก้|จบ/i.test(c.n)),
    e: c.e != null ? c.e : set ? 2 : i === 0 ? 1 : i === 1 ? 2 : 3 }));   // no plan given: build in (1 → 2 → 3)
}
function addBed(END){                                                    // synthesized music in the chosen mood, arranged to the shots
  const quiet = t => HUSH.some(([a, b]) => t >= a - 1e-6 && t < b);
  const full = CONFIG.bed === 'full', CH = MOOD.prog.split(' ').map(chordOf), sw = (MOOD.swing || 0) * 0.5;
  const PLAN = musicPlan(), NBEATS = Math.ceil(END / B(1));
  const sec = beat => { let s = PLAN[0]; for (const p of PLAN) if (p.sb <= beat + 1e-6) s = p; return s; };
  const CHG = [];                                                        // chord changes: every 4 beats counted from each shot's start, so a cut off the bar changes chord on the cut
  PLAN.forEach((p, i) => { const stop = i + 1 < PLAN.length ? PLAN[i + 1].sb : NBEATS; for (let x = i ? p.sb : 0; x < stop - 1e-6; x += 4) CHG.push(x); });
  const chordAt = beat => { let n = 0; for (const x of CHG) if (x <= beat + 1e-6) n++; return CH[(Math.max(1, n) - 1) % CH.length]; };
  const gaps = PLAN.filter(p => p.peak).map(p => [B(p.sb - 0.5), B(p.sb)]);   // a half-beat breath before each peak
  const hushed = t => quiet(t) || gaps.some(([a, b]) => t >= a - 1e-6 && t < b);
  const at = (b, type, arg) => { const t = B(b); if (b >= 0 && t < END && !hushed(t)) cue(t, type, arg); };
  const DRUMS = {                                                        // k = beat in the bar (0–3), b = beat number, x = energy
    four:    (b, k, x) => { at(b, 'kick'); if (k % 2) at(b, 'clap'); at(b + 0.5, 'hat', k === 3 ? 'open' : null); if (x > 2) at(b + 0.75, 'hat', 'ghost'); },
    half:    (b, k) => { if (k === 0) at(b, 'kick'); if (k === 2){ at(b, 'snare', 0.32); at(b + 1.5, 'kick', 0.7); } at(b + 0.5, 'hat', 'ghost'); },
    boom:    (b, k) => { if (k === 0) at(b, 'tom', 0.7); if (k === 2) at(b + 0.5, 'tom', 0.4); if (k === 3) at(b + 0.5, 'rim', 0.12); },
    brush:   (b, k) => { if (k % 2 === 0) at(b, 'kick', 0.45); else at(b, 'snare', 0.1); at(b, 'shaker', 0.05); at(b + 0.5 + sw, 'shaker', 0.07); },
    clapfun: (b, k) => { if (k % 2 === 0) at(b, 'kick', 0.7); else at(b, 'clap'); at(b + 0.5 + sw, 'shaker'); },
    tiny:    (b, k) => { if (k % 2 === 0) at(b, 'kick', 0.55); else at(b, 'rim', 0.2); at(b + 0.5 + sw, 'shaker', 0.06); },
    lazy:    (b, k) => { if (k === 0) at(b, 'kick', 0.6); if (k === 2) at(b + 0.5 + sw, 'kick', 0.45); if (k % 2) at(b, 'snare', 0.16); at(b + 0.5 + sw, 'hat', 'ghost'); },
    soft:    (b, k) => { if (k % 2 === 0) at(b, 'kick', 0.6); else at(b, 'snare', 0.14); at(b + 0.5, 'hat', 'ghost'); },
    sparse:  (b, k) => { if (k === 0) at(b, 'kick', 0.7); if (k === 3) at(b + 0.5, 'rim', 0.1); }
  };
  const BASS = {                                                         // per-beat styles; 'long' and 'sub' play on chord changes
    off8:   (b, k, r) => at(b + 0.5, 'bass', k === 3 ? r * 2 : r),
    roll:   (b, k, r) => { at(b + 0.5, 'bass', r); at(b + 0.75, 'bass', k === 3 ? r * 2 : r); },
    walk:   (b, k, r) => at(b, 'bass', {args:[[r, r * 1.5, r * 2, r * 1.68][k], B(0.8)]}),
    bounce: (b, k, r) => { if (k === 0 || k === 2) at(b, 'bass', {args:[r, 0.18]}); if (k === 1) at(b + 0.5 + sw, 'bass', {args:[r * 1.5, 0.15]}); }
  };
  const LEAD = {
    arp:     (b, k, tn) => [0, 0.5].forEach((h, i) => at(b + h, 'pluck', tn[[0, 1, 2, 1][(k * 2 + i) % 4]] * 2)),
    chime:   (b, k, tn) => { if (k === 0) at(b, 'chime', tn[tn.length - 1] * 2); if (k === 2) at(b, 'chime', tn[1] * 2); },
    marimba: (b, k, tn) => { at(b, 'marimba', tn[[0, 2, 1, 2][k]] * 2); if (k === 1 || k === 3) at(b + 0.5 + sw, 'marimba', tn[2] * 2); },
    uke:     (b, k, tn) => { if (k === 1 || k === 3) at(b + 0.5 + sw, 'uke', tn); if (k === 2) at(b, 'uke', tn); }
  };
  const CHORD = MOOD.chords === 'keys' ? 'keys' : MOOD.chords === 'pad' ? 'pad' : 'softpad';
  // 1. chords on every change (energy 0+), bass on changes for long / sub styles (energy 1+)
  if (full) CHG.forEach(x => { const s = sec(x); if (s.end) return; const {root, tones} = chordAt(x);
    if (CHORD === 'keys'){ at(x, 'keys', tones); if (s.e > 0) at(x + 2 + sw, 'keys', tones); } else at(x, CHORD, {args:[tones, B(4)]});
    if (s.e >= 1 && MOOD.bass === 'long') at(x, 'bass', {args:[root, B(3.6)]});
    if (s.e >= 1 && MOOD.bass === 'sub') at(x, 'sub', {args:[root, B(3.8)]}); });
  // 2. beat by beat: drums (energy 2+, or 1+ for drums-only), per-beat bass (1+), lead (3)
  for (let b = 0; b < NBEATS; b++){
    const s = sec(b), k = b % 4, {root, tones} = chordAt(b); if (s.end || quiet(B(b))) continue;
    if (s.e >= (full ? 2 : 1)) (DRUMS[MOOD.drums] || DRUMS.four)(b, k, s.e);
    if (!full) continue;
    if (s.e >= 1 && BASS[MOOD.bass]) BASS[MOOD.bass](b, k, root);
    if (s.e >= 3 && LEAD[MOOD.lead]) LEAD[MOOD.lead](b, k, tones);
  }
  // 3. fills into shots that lift the energy or peak, the peak hit, and an ending in the mood's own voice
  const FILL = MOOD.drums === 'boom' ? 'tom' : /tiny|brush|sparse/.test(MOOD.drums) ? 'rim' : 'snare';
  PLAN.forEach((p, i) => {
    const prev = PLAN[i - 1];
    if (prev && !p.end && prev.e >= 1 && (p.e > prev.e || p.peak)){ const s0 = p.sb - (p.peak ? 1.5 : 1); [0, 0.25, 0.5, 0.75].forEach((d, n) => at(s0 + d, FILL, [0.06, 0.1, 0.14, 0.2][n] * (FILL === 'tom' ? 2.5 : 1))); }
    if (p.peak && !p.end){ const t = B(p.sb), {root} = chordAt(p.sb); cue(t, 'kick', 1); cue(t, 'crash'); cue(t, 'sub', {args:[root, B(2)]}); }
    if (p.end){ const t = B(p.sb), {root, tones} = CH[0], d = Math.max(2.5, Math.min(4, END - t + 1));
      cue(t, CHORD, {args:[tones, d]}); cue(t, 'sub', {args:[root, d * 0.8]}); cue(t, 'kick', 0.8);
      const top = tones[tones.length - 1] * 2;
      if (MOOD.lead === 'marimba') tones.forEach((f, n) => cue(t + n * 0.08, 'marimba', f * 2));
      else if (MOOD.lead === 'uke') cue(t, 'uke', tones);
      else if (MOOD.lead === 'arp') tones.forEach((f, n) => cue(t + n * 0.09, 'pluck', f * 2));
      else cue(t + 0.02, 'chime', top); }
  });
}

/* ---------- 6. one GSAP timeline + helpers ---------- */
const tl = gsap.timeline({paused:true});
const CHAPTERS = [], CAPTIONS = [];
const chapter = (t, n, m = {}) => CHAPTERS.push({t, n, ...m});         // m = music for this shot: {e:0–3, peak:true, end:true} (references/sound.md › Arrangement)
const caption = (t, end, text, o = {}) => CAPTIONS.push({t, end, text, ...o});   // on-screen subtitle, also exported as .srt; o.pos = 'top' | 'bottom'
const scene = (id, a, b) => { tl.set(id, {autoAlpha:1}, a); if (b != null) tl.set(id, {autoAlpha:0}, b); };
const reveal = (el, at, dur = 0.6) => tl.fromTo(el, {yPercent:140, autoAlpha:0}, {yPercent:0, autoAlpha:1, duration:dur, ease:'expo.out'}, at);   // mask rise (text-fx.md)
const popLine = (el, at, dur = 0.45, origin = '0% 60%') => tl.fromTo(el, {scale:0.25, rotation:-5, autoAlpha:0, transformOrigin:origin}, {scale:1, rotation:0, autoAlpha:1, duration:dur, ease:'back.out(2.6)'}, at);
function popWord(sel, at, avail = 0.6){                                  // letters bounce up one after another from where they sit
  const el = document.querySelector(sel); if (!el.querySelector('.ch')) el.innerHTML = graphemes(el.textContent).map(c => `<span class="ch" style="display:inline-block">${c}</span>`).join('');
  const n = el.children.length, st = Math.min(0.035, avail * 0.3 / Math.max(1, n - 1)), d = Math.min(0.42, avail - st * (n - 1));
  tl.fromTo(sel + ' .ch', {scale:0, yPercent:35, rotation:i => (i % 2 ? 12 : -12), autoAlpha:0, transformOrigin:'50% 85%'}, {scale:1, yPercent:0, rotation:0, autoAlpha:1, duration:d, ease:'back.out(3)', stagger:st}, at);
}
const smearIn = (el, at, fromX, dur = 0.5) => tl.fromTo(el, {x:fromX, '--s':fromX > 0 ? -38 : 38, '--r':16}, {x:0, '--s':0, '--r':0, duration:dur, ease:'expo.out'}, at);

// the click pulls the camera into the button and a radial (zoom) blur sucks the frame in → the outro
const ZT = Math.max(DLT + 0.08, camEnd);
{ // zoom (radial) blur centred on the click itself: the frame is sucked into the button
  const CX0 = CL + PW * 0.4, CY0 = CT + FB.fileY - M * 0.02, SC = 1.2;                 // camera framing held since the file card appeared
  const SX = W / 2 + (DLX - CX0) * SC, SY = H / 2 + (DLY - CY0) * SC, OG = `${px(SX)} ${px(SY)}`, ZD = 0.46;
  const S2E = $('#s2'), S3E = $('#s3'), gA = ghosts(content(S2E), ZT, ZT + ZD + 0.01, {kind:'zoom', amt:1.4, origin:OG, n:7}), gB = ghosts(S3E, ZT + ZD, ZT + ZD + 0.45, {kind:'zoom', amt:0.8, n:6});
  tl.fromTo(S2E, {scale:1}, {scale:2.6, duration:ZD, ease:'power3.in', transformOrigin:OG}, ZT);
  tl.fromTo(gA, {v:0}, {v:1, duration:ZD, ease:'power2.in'}, ZT);
  tl.set(S2E, {autoAlpha:0}, ZT + ZD); tl.set(S3E, {autoAlpha:1}, ZT + ZD);
  tl.fromTo(S3E, {scale:0.7}, {scale:1, duration:0.45, ease:'expo.out', transformOrigin:'50% 50%'}, ZT + ZD);
  tl.fromTo(gB, {v:1}, {v:0, duration:0.45, ease:'power2.out'}, ZT + ZD);
  speedLines(ZT + ZD - 0.2, 0.5, {cx:SX / W, cy:SY / H, color:'#F2B38F', opacity:0.5});
  cue(ZT, 'whoosh', 0.55); cue(ZT + ZD, 'thump', 0.8);
  mark('zoomBlur', ZT - 0.05, ZT + ZD + 0.5);
}
const OUT = ZT + 0.46;
edge('tr', DLT, 0, 0.4);

/* =====================  SHOT 7 · outro: out of the zoom, the light over the grid, the mark, "Claude Opus 5.5" types out centred  ===================== */
FOLD = OUT + 0.05;
chapter(OUT, 'โลโก้', {end:true});
const ORB = $('#orb'), OR = M * 0.13;
Object.assign(ORB.style, {left:px(W / 2 - OR), top:px(H / 2 - OR), width:px(OR * 2), height:px(OR * 2)});
tl.fromTo(ORB, {scale:0, autoAlpha:0}, {scale:1, autoAlpha:0.8, duration:0.35, ease:'power2.out'}, OUT + 0.1);
tl.to(ORB, {scale:0.35, autoAlpha:0, duration:0.4, ease:'power2.in'}, OUT + 0.5);
edge('bl', OUT + 0.4, 0.28, 1.2); edge('tr', OUT + 0.8, 0.22, 1.2);
cue(OUT + 0.1, 'shimmer', 0.9);
const S3 = $('#s3'), FO = M * 0.105, LO = FO * 1.05, MO = LO * MARK_AR, GO = LO * 0.32;
const OT = graphemes('Claude Opus 5.5'), OF = fontOf(600, FO), WID = Array.from({length:OT.length + 1}, (_, n) => n ? ink(OT.slice(0, n).join(''), OF) : null);
const FIRST = ink('C', OF), OM = ink('Claude Opus 5.5', OF);
S3.innerHTML = `<div id="om" style="position:absolute;left:0;top:${px(H / 2 - LO / 2)};width:${px(MO)};height:${px(LO)}">${markSVG('omark', true)}</div>
  <div id="ot" style="position:absolute;left:0;top:${px(topFor(OM, FO, H / 2))};font-size:${px(FO)};line-height:${px(FO)};font-weight:600;white-space:nowrap"><span id="ot1"></span><span id="ot2" style="color:var(--accent2)"></span></div>`;
const R3 = rig(S3);
const drawOut = v => { const n = Math.max(0, Math.min(OT.length, Math.floor(v + 1e-6))), fr = v - n;
  const w0 = n ? WID[n].w : 0, w1 = n + 1 <= OT.length ? WID[n + 1].w : w0, w = n >= OT.length ? w0 : w0 + (w1 - w0) * Math.max(0, fr);
  const g = GO * Math.min(1, v), left = (W - (MO + g + w)) / 2;
  gsap.set('#om', {x:left}); gsap.set('#ot', {x:left + MO + g + FIRST.l});
  const s = OT.slice(0, n).join(''); $('#ot1').textContent = s.slice(0, 6); $('#ot2').textContent = s.slice(6); };
drawOut(0);
tl.fromTo('#om', {scale:0, autoAlpha:0, transformOrigin:'50% 50%'}, {scale:1, autoAlpha:1, duration:0.55, ease:'back.out(2.2)'}, OUT + 0.45); cue(OUT + 0.45, 'impact');
tl.fromTo(['#omark-g1', '#omark-g2'], {opacity:0.8}, {opacity:0.2, duration:1.0, ease:'power2.out'}, OUT + 0.6);
const TO0 = OUT + 1.05, TOD = 1.25;
proxy(TO0, TOD, 0, OT.length, drawOut, 'power1.inOut');
for (let i = 0; i < OT.length; i += 2) cue(TO0 + i / OT.length * TOD * 0.95, 'key', i);
cue(TO0 + TOD + 0.05, 'softding', 1319);
const END_AT = Math.ceil((TO0 + TOD + 1.6) * 2) / 2;
tl.fromTo(R3.dolly, {scale:1}, {scale:1.035, duration:END_AT - OUT, ease:'none'}, OUT);
if (tl.duration() < END_AT) tl.to({}, {duration:END_AT - tl.duration()}, tl.duration());
}

/* ================= end of SHOTS ================= */

/* ---------- 7. build after fonts (and any iframes) are ready, then start the player ---------- */
Promise.all(READY).then(() => { build(); startPlayer(); });

/* ---------- 8. player ---------- */
function startPlayer(){
const END = tl.duration();
if (window.USE_BEAT && !CONFIG.bed) CONFIG.bed = 'beat';                                // older opt-in still works
if (CONFIG.bpm && !CONFIG.music && qs.get('beat') !== '0' && CONFIG.bed) addBed(END);
CUES.sort((a, b) => a.t - b.t);
const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
let last = 0, sched = -1, playing = false, ccOn = CONFIG.captions;
const music = CONFIG.music ? Object.assign(new Audio(CONFIG.music), {preload:'auto'}) : null;
const S0 = CONFIG.songStart || 0, songAt = t => t + S0;                  // clip time -> song time
const ccEl = $('#cc'); ccEl.className = qs.get('cc') || CONFIG.ccStyle || 'box'; ccEl.style.fontSize = px(M * (VERT ? 0.042 : 0.036));
const CCPOS = { bottom: VERT ? H * 0.2 : H * 0.07, top: VERT ? H * 0.13 : H * 0.07 };   // clear of TikTok / Reels / Shorts UI in 9:16
function drawCaption(now){
  const c = ccOn ? CAPTIONS.find(c => now >= c.t && now < c.end) : null;
  const html = c ? `<span style="max-width:${VERT ? 76 : 86}%">${c.text}</span>` : '';
  if (c){ const pos = c.pos || CONFIG.ccPos || 'bottom'; ccEl.style.top = pos === 'top' ? px(CCPOS.top) : ''; ccEl.style.bottom = pos === 'top' ? '' : px(CCPOS.bottom); }
  if (ccEl.innerHTML !== html) ccEl.innerHTML = html;
}
function render(now){                                                    // everything that must follow the clock, also while scrubbing
  drawCaption(now);
  if (FOOTAGE.length) syncFootage(now, playing);
  if (window.onClipTime) window.onClipTime(now);
  for (const h of HOOKS) h(now);                                          // transitions, ghosts, handheld camera (section 6b)                          // e.g. applyWallet(now) for real-UI pose drivers
  $('#fill').style.width = (now / END * 100) + '%';
  $('#time').textContent = fmt(now) + ' / ' + fmt(END);
}
GHOSTS.forEach(makeGhosts);                                              // copies for motion blur, made after every tween has its targets
tl.time(END, false); tl.time(0, false);                                  // prime every tween BEFORE the loop callback exists
tl.eventCallback('onUpdate', () => {
  const now = tl.time();
  if (playing && ac && now >= last && now - last < 0.35){           // sound only while playing forward, never while scrubbing
    const lat = Math.min(0.25, (ac.outputLatency || 0) + (ac.baseLatency || 0)), until = now + lat + 0.04;   // schedule ahead so sounds land on their frame
    CUES.forEach(c => { if (c.t > sched && c.t <= until && ON[groupOf(c.type)]) play(c.type, ac.currentTime + Math.max(0, c.t - now - lat + (c.late != null ? c.late : LATE[c.type] || 0)), c.arg); });
    sched = Math.max(sched, until);
  }
  last = now; render(now);
});
render(0);
tl.eventCallback('onComplete', () => { if (window.CLIP_RENDERING) return; tl.time(0); last = 0; sched = -0.001; if (music) music.currentTime = songAt(0); tl.play(); });   // loop (not while scripts render)
const playBtn = $('#play');
function setPlaying(p){ playing = p; playBtn.textContent = p ? 'Pause' : 'Play'; if (FOOTAGE.length) syncFootage(tl.time(), p); }
playBtn.onclick = () => {
  ensureAudio();
  if (playing){ tl.pause(); music && music.pause(); setPlaying(false); }
  else { last = tl.time(); sched = last - 0.001; if (music){ music.currentTime = songAt(tl.time()); music.muted = !ON.music; music.play(); } tl.play(); setPlaying(true); }
};
const jump = s => { tl.time(Math.max(0, Math.min(END, s))); last = tl.time(); sched = last - 0.001; if (music) music.currentTime = songAt(tl.time()); };
const rail = $('#rail');
const seek = e => { const r = rail.getBoundingClientRect(); jump(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * END); };
rail.addEventListener('pointerdown', e => { rail.setPointerCapture(e.pointerId); seek(e); rail.onpointermove = seek; });
rail.addEventListener('pointerup', () => { rail.onpointermove = null; });
const fpsSel = $('#fps');
function setFps(v){ gsap.ticker.fps(+v); fpsSel.value = String(v); }
fpsSel.onchange = () => setFps(fpsSel.value);
setFps(CONFIG.fps);
let frames = 0, since = performance.now();
gsap.ticker.add(() => {
  frames++; const now = performance.now();
  if (now - since >= 1000){ $('#meter').textContent = Math.round(frames * 1000 / (now - since)) + ' fps'; frames = 0; since = now; }
  if (music && playing && Math.abs(music.currentTime - songAt(tl.time())) > 0.08) tl.time(music.currentTime - S0);   // music is the master clock
  if (music) music.volume = Math.max(0, Math.min(1, (END - tl.time()) / (CONFIG.songFade || 0.001)));               // fade out at the end
});
const toggleGroup = k => { ON[k] = !ON[k]; $(k === 'music' ? '#mus' : '#sfx').textContent = (k === 'music' ? 'Music ' : 'SFX ') + (ON[k] ? 'on' : 'off'); if (music && k === 'music') music.muted = !ON.music; ensureAudio(); applyMute(); };
$('#mus').onclick = () => toggleGroup('music'); $('#sfx').onclick = () => toggleGroup('sfx');
const toggleCC = () => { ccOn = !ccOn; $('#ccb').textContent = ccOn ? 'CC on' : 'CC off'; drawCaption(tl.time()); };
$('#ccb').onclick = toggleCC; $('#ccb').textContent = ccOn ? 'CC on' : 'CC off'; $('#ccb').hidden = !CAPTIONS.length;   // only when the clip has captions
/* safe zones for 1080x1920 (approximate, platforms change their UI: check before posting) */
const SAFE = { tiktok:{t:108, b:320, l:60, r:120}, reels:{t:210, b:310, l:0, r:84}, shorts:{t:120, b:300, l:0, r:96} };
function setSafe(v){
  const el = $('#safe'); $('#safeSel').value = v; el.innerHTML = ''; el.style.display = v ? 'block' : 'none';
  if (!v) return;
  if (!VERT){ el.innerHTML = `<i style="left:0;top:0;right:0;height:${px(H * 0.05)}"></i><i style="left:0;bottom:0;right:0;height:${px(H * 0.05)}"></i><i style="left:0;top:0;bottom:0;width:${px(W * 0.05)}"></i><i style="right:0;top:0;bottom:0;width:${px(W * 0.05)}"></i><b>Title-safe 90%</b>`; return; }
  const k = W / 1080, z = v === 'all' ? {t:210, b:320, l:60, r:120} : SAFE[v];
  el.innerHTML = `<i style="left:0;top:0;right:0;height:${px(z.t * k)}"></i><i style="left:0;bottom:0;right:0;height:${px(z.b * k)}"></i>
    ${z.l ? `<i style="left:0;top:${px(z.t * k)};bottom:${px(z.b * k)};width:${px(z.l * k)}"></i>` : ''}<i style="right:0;top:${px(z.t * k)};bottom:${px(z.b * k)};width:${px(z.r * k)}"></i>
    <b>${({all:'All platforms', tiktok:'TikTok', reels:'IG Reels', shorts:'YT Shorts'})[v]} UI</b>`;
}
$('#safeSel').onchange = e => setSafe(e.target.value);
setSafe(qs.get('safe') ?? CONFIG.safeZone);
function toggleFull(){
  if (document.fullscreenElement) { document.exitFullscreen(); return; }
  if (screen.classList.contains('ffs')) { screen.classList.remove('ffs', 'rot'); setTimeout(fit, 60); return; }
  const fake = () => { screen.classList.add('ffs'); if (W > H && innerHeight > innerWidth) screen.classList.add('rot'); setTimeout(fit, 60); };
  if (screen.requestFullscreen) screen.requestFullscreen().then(() => setTimeout(fit, 60)).catch(fake);
  else fake();                                                           // iPhone: fake fullscreen, rotates landscape clips
}
$('#fs').onclick = toggleFull;
document.addEventListener('fullscreenchange', () => setTimeout(fit, 60));
CHAPTERS.forEach(c => { const b = document.createElement('button'); b.textContent = fmt(c.t) + ' ' + c.n; b.onclick = () => jump(c.t); $('#chapters').append(b); });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = e.key;
  if (k === ' ') { e.preventDefault(); playBtn.click(); }
  else if (k === 'ArrowRight') jump(tl.time() + 1);
  else if (k === 'ArrowLeft') jump(tl.time() - 1);
  else if (k === 'Home') jump(0);
  else if (k === 'f' || k === 'F') toggleFull();
  else if (k === 'm' || k === 'M') toggleGroup('music');
  else if (k === 's' || k === 'S') toggleGroup('sfx');
  else if (k === 'c' || k === 'C') toggleCC();
  else if (k === 'z' || k === 'Z') { const o = ['', 'all', 'tiktok', 'reels', 'shorts']; setSafe(o[(o.indexOf($('#safeSel').value) + 1) % o.length]); }
  else if (k === 'Escape' && screen.classList.contains('ffs')) toggleFull();
});
screen.addEventListener('pointerdown', ensureAudio);

/* ---------- 9. API for scripts/check.js and scripts/render.js ---------- */
async function renderAudio(sampleRate = 48000){                          // offline mix of every cue (+ music) -> [left, right]
  const len = Math.ceil((END + 0.6) * sampleRate), off = new OfflineAudioContext(2, len, sampleRate), live = [ac, bus, verb, NB, GR];
  useCtx(off);                                                           // same bus + synths; the mute buttons don't apply to exports
  try {
    CUES.forEach(c => play(c.type, c.t + 0.001, c.arg));
    const bytes = u => fetch(u).then(r => r.arrayBuffer()).catch(() => new Promise((ok, no) => {   // file:// pages can't fetch(); XHR can (render.js allows file access)
      const x = new XMLHttpRequest(); x.open('GET', u); x.responseType = 'arraybuffer'; x.onload = () => x.response ? ok(x.response) : no(new Error('could not read ' + u)); x.onerror = () => no(new Error('could not read ' + u)); x.send(); }));
    if (music){ const buf = await off.decodeAudioData(await bytes(CONFIG.music)), s = off.createBufferSource(), g = off.createGain(), f = CONFIG.songFade || 0;
      s.buffer = buf; s.connect(g); g.connect(off.destination); s.start(0, S0); s.stop(END + 0.05);
      if (f){ g.gain.setValueAtTime(1, Math.max(0, END - f)); g.gain.linearRampToValueAtTime(0, END); } }
  } finally { [ac, bus, verb, NB, GR] = live; }
  const r = await off.startRendering();
  return [r.getChannelData(0), r.getChannelData(1)];
}
window.CLIP = { tl, W, H, END, CHAPTERS, CAPTIONS, CUES, BT, FOOTAGE, setSafe, renderAudio, seek:t => { tl.time(t, false); render(t); }, settle:settleFootage, ready:!FOOTAGE.length };
if (FOOTAGE.length) Promise.all(FOOTAGE.map(f => f.ready)).then(() => { render(tl.time()); CLIP.ready = true; });   // check / render wait for the videos
}
