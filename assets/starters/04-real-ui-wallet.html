<html lang="en">
<head>
<meta charset="utf-8">

<title>MePocket Motion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;700;800;900&family=Noto+Sans+Thai:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0c;--bg2:#141518;--fg:#f2f5f2;--muted:#8f9691;--accent:#c8ff5b;--mint:#58f38e;--pink:#ff3d7f;--violet:#a987ff;--paper:#f4f5f2;--ink:#111214;--card:#1c1d20;--line:#2e3034;
  --font:'Inter Tight','Noto Sans Thai',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%;background:#000;color:var(--fg);font-family:var(--font)}
.player{max-width:1280px;margin:0 auto;padding:16px}
.screen{position:relative;width:100%;margin:0 auto;background:#000;overflow:hidden;border-radius:14px}
.screen.ffs{position:fixed;inset:0;z-index:99;width:auto!important;max-width:none!important;border-radius:0;aspect-ratio:auto!important}
.screen.ffs.rot{inset:auto;left:50%;top:50%;width:100vh!important;height:100vw;transform:translate(-50%,-50%) rotate(90deg)}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--bg)}
.scene{position:absolute;inset:0;visibility:hidden;overflow:hidden}
.world{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:0 0}
.layer{position:absolute;inset:0}
.controls{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-top:12px}
.controls button,.controls select,.chapters button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.rail{flex:1 1 200px;height:8px;background:#2a2b2f;border-radius:4px;position:relative;cursor:pointer;touch-action:none}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);border-radius:4px}
#time,#meter{font-variant-numeric:tabular-nums;font-size:14px}
#meter{color:var(--muted);min-width:56px}
.chapters{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hint{margin-top:10px;color:var(--muted);font-size:12px}


/* smear + RGB split, driven by two CSS variables (no blur filter) */
.fx{--s:0;--r:0;text-shadow:
  calc(var(--s) * -1px) 0 0 color-mix(in srgb, currentColor 40%, transparent),
  calc(var(--s) * -2px) 0 0 color-mix(in srgb, currentColor 22%, transparent),
  calc(var(--s) * -3.2px) 0 0 color-mix(in srgb, currentColor 10%, transparent),
  calc(var(--r) * 1px) 0 0 rgba(255,61,127,.75),
  calc(var(--r) * -1px) 0 0 rgba(61,200,255,.65)}
/* the same glitch, jammed in the logo green instead of red / cyan */
.fxg{--s:0;--r:0;--ga:rgba(88,243,142,.9);--gb:rgba(10,104,54,.85);text-shadow:
  calc(var(--s) * -1px) 0 0 color-mix(in srgb, currentColor 40%, transparent),
  calc(var(--s) * -2px) 0 0 color-mix(in srgb, currentColor 22%, transparent),
  calc(var(--s) * -3.2px) 0 0 color-mix(in srgb, currentColor 10%, transparent),
  calc(var(--r) * 1px) calc(var(--r) * -.3px) 0 var(--ga),
  calc(var(--r) * -1px) calc(var(--r) * .3px) 0 var(--gb)}
.mask{overflow:visible;padding:.14em .08em .04em}
.cap-word .ch,.pop-ch{display:inline-block}
.mask>span{display:inline-block}
.num{font-weight:800;letter-spacing:-.045em;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.num span{display:inline-block}
.caps{font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.light{background:var(--paper);color:var(--ink)}

/* shot 1 */
#row{position:absolute;left:0;top:0;color:var(--mint);white-space:nowrap;font-weight:900}
#mil{position:absolute;left:0;top:0;color:var(--mint);font-weight:900;letter-spacing:-.045em;line-height:1;white-space:nowrap}
#row,#mil{--ga:rgba(214,255,228,.85);--gb:rgba(8,96,52,.95)}
#mil span{display:inline-block}
/* shot 2 */
#s2{z-index:2}
#pill{position:absolute;display:flex;align-items:center;justify-content:center}
#pstroke{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#plabel{position:absolute;left:50%;top:0;transform:translate(-50%,-52%);display:flex;align-items:center;background:transparent;white-space:nowrap;font-weight:800;letter-spacing:-.02em}
#plabel span.ch{display:inline-block}
#pv{position:relative;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.045em;word-spacing:.22em;line-height:1;white-space:nowrap}
#pv span{display:inline-block}
#pvZ{position:absolute;top:0;word-spacing:0}
#pcap{position:absolute;left:0;right:0;text-align:center}
#streak{position:absolute;inset:0;z-index:20;pointer-events:none;visibility:hidden;filter:url(#hbox-blur)}
#streak i{position:absolute;left:0;border-radius:999px}
/* shot 3: the real wallet + the hero card */
#wbox{position:absolute;left:0;top:0;transform-origin:0 0}
#hbox{position:absolute;left:0;top:0;transform-origin:0 0}
#wbox iframe,#hbox iframe,.gb iframe,#ghbox iframe,.gfan iframe{position:absolute;left:0;top:0;border:0;background:transparent;overflow:hidden;pointer-events:none}
#glow3{--gc:#0ea29d;position:absolute;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--gc) 17%,transparent),transparent)}
.cap-word{position:absolute;font-weight:900;letter-spacing:-.045em;line-height:1;white-space:nowrap}
.cap-sub{position:absolute;font-weight:500;color:var(--muted);line-height:1.3}
.btn-plus{position:absolute;border-radius:50%;background:var(--accent);color:var(--ink);display:grid;place-items:center;font-weight:800;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.field{position:absolute;border-radius:22px;background:#1c1d20;border:2px solid #2e3034;display:flex;flex-direction:column;justify-content:center}
.field small{color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.field b{font-weight:700;color:var(--fg);white-space:nowrap}
.caret{display:inline-block;width:.08em;height:1em;background:var(--accent);vertical-align:-.12em;margin-left:.05em}
.sw{position:absolute;border-radius:50%}
#ring{position:absolute;border-radius:50%;border:solid var(--fg)}
.chip{position:absolute;border-radius:999px;display:flex;align-items:center;font-weight:800;white-space:nowrap}
/* shot 5: a stack of goal boxes */
.gb{position:absolute}
/* shot 5b: the gauge, laid almost flat */
#plane{position:absolute;left:0;top:0;transform-origin:50% 50%}
.tick{stroke:#2e3034;stroke-linecap:round}
.tick.on{stroke:var(--accent)}
.tick.tip{stroke:var(--pink)}
/* shot 6 */
#sweep{--ga:rgba(214,255,228,.85);--gb:rgba(8,96,52,.95);position:absolute;left:0;top:50%;color:var(--mint);font-weight:900;letter-spacing:-.05em;line-height:1;white-space:nowrap}
</style>
</head>
<body>
<div class="player">
  <div class="screen" id="screen"><div class="stage" id="stage">

    <!-- S1 · ฿1 -> ฿1,000,000 -> ฿1 MILLION -->
    <section class="scene" id="s1"><div class="layer" id="z1"><div class="world" id="w1">
      <div class="num fxg" id="row"><span id="n100">฿<span id="z0">1</span></span><span id="g1">,000</span><span id="g2">,000</span></div>
      <div class="fxg" id="mil">MILLION</div>
    </div></div></section>

    <!-- S2 · logo capsule -->
    <section class="scene light" id="s2"><div class="layer" id="z2">
      <div id="pill">
        <svg id="pstroke"></svg>
        <div id="plabel"><svg id="plogo" viewBox="0 0 96 96"><path class="lp" d="M22 32h52a8 8 0 0 1 8 8v30a10 10 0 0 1-10 10H24A10 10 0 0 1 14 70V42a10 10 0 0 1 8-10Z" fill="#111214"/><path class="lp" d="M27 20h38a8 8 0 0 1 8 8v4H22v-7a5 5 0 0 1 5-5Z" fill="#58f38e"/><circle class="lp" cx="66" cy="56" r="8" fill="#f4f5f2"/></svg><span id="pname"></span></div>
        <div class="fxg" id="pv"><span id="pvA">฿<span id="pv1">1</span></span> <span id="pvM">MILLION</span><span id="pvZ"><span id="pz1">,000</span><span id="pz2">,000</span></span></div>
        <div class="mask" id="pcapm"><span class="caps" id="pcap">POCKETED</span></div>
      </div>
    </div></section>

    <!-- S3 · hero card -> the real wallet (swipe, peek, add, open, pull, nudge) -->
    <section class="scene" id="s3" style="background:#0b0b0c">
      <div class="world" id="w3"><div id="glow3"></div><div id="wbox"><iframe id="wf" title="MePocket wallet" tabindex="-1" scrolling="no"></iframe></div></div>
      <div id="paper3" style="position:absolute;inset:0;background:#f4f5f2;visibility:hidden"></div>
      <div id="hbox"><iframe id="hf" title="MePocket card" tabindex="-1" scrolling="no"></iframe></div>
      <div class="layer" id="ui3"></div>
      <div class="layer" id="ui4"></div>
    </section>

    <!-- S5 · goal boxes -->
    <section class="scene light" id="s5">
      <div class="layer" id="ui5"></div>
      <div class="layer" id="gstack"></div>
    </section>

    <!-- S5b · gauge on a tilted plane -->
    <section class="scene" id="s5b"><div class="layer" id="z5b" style="transform-origin:0 0"><div id="plane">
      <svg id="gauge" style="position:absolute"></svg>
      <div id="gc" style="position:absolute;display:flex;flex-direction:column;align-items:center;text-align:center">
        <div class="num" id="gpct">0%</div>
        <div id="gname" style="font-weight:700"></div>
        <div id="gsum" style="color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums"></div>
      </div>
      <svg id="gcheck" style="position:absolute;overflow:visible"><path id="gcp" fill="none" stroke="#58f38e" stroke-linecap="round" stroke-linejoin="round" pathLength="1" stroke-dasharray="1 2" stroke-dashoffset="1"/></svg>
    </div></div>
    <div id="ghbox" style="position:absolute;left:0;top:0;transform-origin:0 0"><div class="gfan" id="gfan1" style="position:absolute"><iframe id="gff1" title="MePocket goal" tabindex="-1" scrolling="no"></iframe></div><div class="gfan" id="gfan2" style="position:absolute"><iframe id="gff2" title="MePocket goal" tabindex="-1" scrolling="no"></iframe></div><iframe id="ghf" title="MePocket goal" tabindex="-1" scrolling="no"></iframe></div></section>

    <!-- S6 · brand sweep + logo -->
    <section class="scene" id="s6"><div class="fxg" id="sweep">MePocket</div></section>
    <section class="scene light" id="s7"><div class="layer" style="display:grid;place-items:center">
      <svg id="logo" viewBox="0 0 96 96"><rect class="lp" width="96" height="96" rx="26" fill="#17181b"/><path class="lp" d="M22 32h52a8 8 0 0 1 8 8v30a10 10 0 0 1-10 10H24A10 10 0 0 1 14 70V42a10 10 0 0 1 8-10Z" fill="#58f38e"/><path class="lp" d="M27 20h38a8 8 0 0 1 8 8v4H22v-7a5 5 0 0 1 5-5Z" fill="#fff"/><circle class="lp" cx="66" cy="56" r="8" fill="#17181b"/></svg>
    </div></section>
    <div id="streak"></div>
    <svg width="0" height="0" style="position:absolute"><filter id="hbox-blur" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB"><feGaussianBlur id="hbb" stdDeviation="0 0"/></filter></svg>
  </div></div>
  <div class="controls">
    <button id="play">Play</button><span id="time">0:00 / 0:00</span>
    <div class="rail" id="rail"><div class="fill" id="fill"></div></div>
    <select id="fps" aria-label="frame rate">
      <option value="120">120 fps</option><option value="60">60 fps</option><option value="30">30 fps</option><option value="24">24 fps</option>
    </select><span id="meter">– fps</span>
    <button id="mus">Music on</button><button id="sfx">SFX on</button><button id="fs">Fullscreen</button>
  </div>
  <nav class="chapters" id="chapters"></nav>
  <p class="hint">Space เล่น/หยุด · ←/→ เลื่อน 1 วิ · Home เริ่มใหม่ · F เต็มจอ · M เปิด/ปิดเพลง · S เปิด/ปิดเอฟเฟกต์</p>
</div>

<script>
const $ = s => document.querySelector(s);
const APP = JSON.parse($('#appdata').textContent);

/* ---------- 1. settings ---------- */
const CONFIG = { aspect: '16:9', fps: 120, bpm: 120, music: null };
const SIZES = { '16:9':[1920,1080], '21:9':[2520,1080], '9:16':[1080,1920], '4:3':[1440,1080], '3:4':[1080,1440] };
const [W, H] = SIZES[CONFIG.aspect] || SIZES['16:9'];
const M = Math.min(W, H);
const px = v => Math.round(v) + 'px';
const B = n => n * 60 / CONFIG.bpm;                         // beat -> seconds; every cut sits on a beat

/* ---------- 2. fit ---------- */
const stage = $('#stage'), screen = $('#screen');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
screen.style.aspectRatio = W + ' / ' + H;
screen.style.maxWidth = `calc(78vh * ${W / H})`;
function fit(){
  const w = screen.clientWidth, h = screen.clientHeight, s = Math.min(w / W, h / H);
  stage.style.transform = `translate(${(w - W * s) / 2}px,${(h - H * s) / 2}px) scale(${s})`;
}
new ResizeObserver(fit).observe(screen); fit();
const cam = (cx, cy, s) => ({ x: W / 2 - cx * s, y: H / 2 - cy * s, scale: s });
const camAt = (cx, cy, s, sx, sy) => ({ x: sx - cx * s, y: sy - cy * s, scale: s });   // put world point at screen point (sx, sy)

/* ---------- 3. sound ---------- */
// everything is synthesized; a master bus (glue compressor + small room reverb) gives it depth instead of thin, dry beeps
let ac = null, bus = null, verb = null, NB = null, GR = null, grp = 'sfx';
const ON = { music:true, sfx:true };                   // music (beat, bass, pads) and effects are mixed on separate groups, muted separately
const MUSIC = new Set(['kick', 'hat', 'clap', 'snare', 'bass', 'pad', 'pluck']);
const groupOf = type => MUSIC.has(type) ? 'music' : 'sfx';
function makeBus(ctx){
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -16; comp.knee.value = 12; comp.ratio.value = 3.5; comp.attack.value = 0.005; comp.release.value = 0.2;
  const warm = ctx.createBiquadFilter(); warm.type = 'lowshelf'; warm.frequency.value = 80; warm.gain.value = 2;
  const tame = ctx.createBiquadFilter(); tame.type = 'highshelf'; tame.frequency.value = 6000; tame.gain.value = 1.5;
  const master = ctx.createGain(); master.gain.value = 0.8;
  const b = ctx.createGain(); b.connect(warm); warm.connect(tame); tame.connect(comp); comp.connect(master); master.connect(ctx.destination);
  const len = ctx.sampleRate * 2.2 | 0, ir = ctx.createBuffer(2, len, ctx.sampleRate);
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 1073741823.5 - 1;
  for (let c = 0; c < 2; c++){ const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = rnd() * Math.pow(1 - i / len, 3.2); }
  const v = ctx.createConvolver(); v.buffer = ir; const vg = ctx.createGain(); vg.gain.value = 0.32; v.connect(vg); vg.connect(b);
  const n = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate), nd = n.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = rnd();
  const G = {};
  ['music', 'sfx'].forEach(k => { const dry = ctx.createGain(), wet = ctx.createGain(); dry.connect(b); wet.connect(v); G[k] = {dry, wet}; });
  return {bus:b, verb:v, NB:n, GR:G};
}
function useCtx(ctx){ ac = ctx; ({bus, verb, NB, GR} = makeBus(ctx)); applyMute(); }
function applyMute(){ if (!GR) return; for (const k in GR){ const v = ON[k] ? 1 : 0, now = ac.currentTime; ['dry', 'wet'].forEach(x => { GR[k][x].gain.cancelScheduledValues(now); GR[k][x].gain.setTargetAtTime(v, now, 0.03); }); } }
function play(type, t, arg){ grp = groupOf(type); SFX[type](t, arg); }
function ensureAudio(){ if (!ac) useCtx(new (window.AudioContext || window.webkitAudioContext)()); if (ac.state === 'suspended') ac.resume(); }
function out(send = 0){ const G = GR[grp], g = ac.createGain(); g.connect(G.dry); if (send){ const s = ac.createGain(); s.gain.value = send; g.connect(s); s.connect(G.wet); } return g; }
// oscillator voice: pitch glide, attack, optional low-pass, optional reverb send
function tone(type, f0, f1, t, d, v, o = {}){
  const osc = ac.createOscillator(), g = out(o.send || 0); let node = osc;
  osc.type = type; osc.frequency.setValueAtTime(f0, t); osc.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + (o.glide || d));
  if (o.detune) osc.detune.value = o.detune;
  if (o.lp){ const f = ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = o.lp; f.Q.value = o.q || 0.7; node.connect(f); node = f; }
  const a = o.a || 0.006;
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  node.connect(g); osc.start(t); osc.stop(t + d + 0.05);
}
function noise(t, d, v, f0, f1, q = 1, o = {}){
  const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = out(o.send || 0);

  plane.style.transform = `perspective(${PERSP}px) rotateX(${ax}deg) rotateZ(${cz}deg)`;
  const ns = Math.round(lp * NS);
  SEGS.forEach((el, i) => el.setAttribute('opacity', i < ns ? 1 : 0));
  const [hx, hy] = pt(ARC0 + ARC * ns / NS); CAP0.setAttribute('opacity', ns ? 1 : 0);
  Object.entries({cx:hx, cy:hy, fill:gcol(Math.max(0, ns - 1) / (NS - 1)), opacity:ns ? 1 : 0}).forEach(([k, v]) => CAP1.setAttribute(k, v));
  $('#gpct').textContent = Math.round(lp * 100) + '%';
  $('#gsum').textContent = `${thb(lp * GAUGE_TARGET)} / ${thb(GAUGE_TARGET)}`;
  const ha = (ARC0 + ARC * lp) * D2R, head = proj(Math.cos(ha) * GR, Math.sin(ha) * GR, ax, cz), mid = proj(0, PCY, ax, cz);
  const lean = 0.3 * clamp01(lp * 5);                                    // starts dead centre on the first tick, then lets the numbers peek in
  const fx = lerp(lerp(head[0], mid[0], lean), mid[0], zo), fy = lerp(lerp(head[1], mid[1], lean), mid[1], zo);
  const sc = Math.exp(lerp(lerp(Math.log(2.8), Math.log(2.2), lp), 0, zo));
  gsap.set('#z5b', {x:W / 2 - fx * sc, y:H / 2 - fy * sc, scale:sc});
}
chapter(B(41), 'Gauge');
scene('#s5b', B(41), B(48));
proxy(B(41), GT, 0, 1, drawGauge, 'none');
for (let i = 0; i < 11; i++) cue(T38 + L0 + LD * loadInv(i / 10), 'tick', PENTA[i]);           // climbs the scale as the arc fills
cue(B(41), 'softwhoosh', 0.45); cue(T38 + Z0, 'softwhoosh', 0.45);
// 100% twists into a check mark
const TM = T38 + Z0 + ZD + 0.05;
tl.to('#gpct', {scaleX:0.08, scaleY:1.15, autoAlpha:0, duration:0.2, ease:'power3.in'}, TM);
tl.fromTo('#gcheck', {scale:0.55, rotation:-25, transformOrigin:'50% 50%'}, {scale:1, rotation:0, duration:0.4, ease:'back.out(2.2)'}, TM + 0.1);
proxy(TM + 0.1, 0.28, 1, 0, v => $('#gcp').setAttribute('stroke-dashoffset', v), 'power2.out'); sfx(TM + 0.1, 'menuSuccess', 0.7);
// the check fades into the finished goal card that was waiting behind it, then the camera pulls out
const ghd = ghf.contentDocument, gcard = ghd.querySelector('.goal-card');
const ghb = boxIn(gcard, GCW), GHW = ghb.w * GHZ, GHH = ghb.h * GHZ;
const CAPH = M * 0.5 * 0.727;                                            // cap height of the MePocket sweep: the card ends exactly that tall
const KE = CAPH / GHH, KS = Math.min(1, KE * 3.2);
const ghbox = $('#ghbox');
const placeCard = k => { ghbox.style.transform = `translate(${W / 2 - (ghb.x * GHZ + GHW / 2) * k}px,${H / 2 - (ghb.y * GHZ + GHH / 2) * k}px) scale(${k})`; };
const TC = TM + 0.4;
tl.fromTo('#ghbox', {autoAlpha:0}, {autoAlpha:1, duration:0.15, ease:'none'}, TC); cue(TC, 'impact');
tl.to('#plane', {autoAlpha:0, duration:0.15, ease:'none'}, TC + 0.05);
proxy(TC, 0.5, 0, 1, e => { placeCard(Math.exp(lerp(Math.log(KS), Math.log(KE), e))); }, 'expo.inOut'); cue(TC + 0.05, 'softwhoosh', 0.4);
// the check is on top of the card for a beat, then melts into it
$('#s5b').append(gck); Object.assign(gck.style, {left:px(W / 2 - CK / 2), top:px(H / 2 - CK / 2)});
tl.to('#gcheck', {autoAlpha:0, scale:0.7, duration:0.22, ease:'power2.in'}, TC + 0.12);

/* ===== S6 · the name sweeps across in logo green and takes the card with it; then the logo (beats 43–48) ===== */
const sw = $('#sweep'); sw.style.fontSize = px(M * 0.5); sw.style.marginTop = px(-M * 0.25);
const SW0 = B(47.2), SW1 = B(49.1), SX0 = W * 1.02, SX1 = -sw.offsetWidth - W * 0.05, SD = SW1 - SW0;
const atX = x => SW0 + SD * (SX0 - x) / (SX0 - SX1);                  // when the name's leading edge reaches x
const cardR = W / 2 + ghb.w * GHZ * KE / 2, cardL = W / 2 - ghb.w * GHZ * KE / 2;
chapter(SW0, 'Brand sweep');
tl.set('#s6', {autoAlpha:1}, SW0); tl.set('#s6', {autoAlpha:0}, SW1);
tl.fromTo('#sweep', {x:SX0, '--s':-40, '--r':16}, {x:SX1, '--s':-40, '--r':6, duration:SD, ease:'none'}, SW0); cue(atX(W * 0.75), 'shoosh', 0.34);
tl.to('#ghbox', {autoAlpha:0, duration:atX(cardL) - atX(cardR), ease:'none'}, atX(cardR));
{
  // hinge near the RIGHT edge, so the two boxes fan out on the left; slightly smaller so no edge ever shows past the main card
  const PX_ = ghb.x + ghb.w * 0.7, PY_ = ghb.y + ghb.h / 2, m = GHZ / GFZ;
  const T_OPEN = TC + 0.08, T_FOLD = atX(cardR) - 0.34;
  [[1, 1], [2, -1]].forEach(([k, dir]) => {
    const el = $('#gfan' + k);
    Object.assign(el.style, {left:px(PX_ * GHZ - PX_ * GFZ), top:px(PY_ * GHZ - PY_ * GFZ), width:px(GFW * GFZ), height:px(GFH * GFZ)});
    gsap.set(el, {transformOrigin:`${PX_ * GFZ}px ${PY_ * GFZ}px`, scale:m * 0.9});
    tl.fromTo(el, {autoAlpha:0, rotation:0}, {autoAlpha:1, rotation:dir * 8, duration:0.45, ease:'back.out(1.6)'}, T_OPEN + (k - 1) * 0.06);
    tl.to(el, {rotation:0, duration:0.24, ease:'power2.in'}, T_FOLD);
    tl.set(el, {autoAlpha:0}, T_FOLD + 0.24);
  });
  cue(T_OPEN, 'softwhoosh', 0.3); cue(T_FOLD, 'softwhoosh', 0.28); cue(T_FOLD + 0.22, 'poke', 260);
}
chapter(SW1, 'Logo');
scene('#s7', SW1);
$('#logo').style.width = $('#logo').style.height = px(M * 0.26);
gsap.utils.toArray('#logo .lp').forEach((el, i) => {
  const from = [{scale:0}, {x:-70, rotation:-60}, {y:-70, rotation:80}, {x:60, scale:0}][i];
  tl.fromTo(el, {...from, autoAlpha:0, transformOrigin:'50% 50%'}, {x:0, y:0, rotation:0, scale:1, autoAlpha:1, duration:0.4, ease:'back.out(1.8)'}, SW1 + i * 0.12);
  cue(SW1 + i * 0.12, 'pop');
});
punch('#logo', B(50.8), 1.1); cue(B(50.8), 'impact');
tl.to({}, {duration:B(52) - B(50.8)}, B(50.8));

/* beat track: A-minor loop (Am F C G, one chord per bar) with an off-beat bass, pads, fills and drop-outs */
if (!CONFIG.music){
  const CH = [[55, [220, 262, 330]], [43.65, [175, 220, 262]], [65.4, [262, 330, 392]], [49, [196, 247, 294]]];   // root, pad voicing
  const hush = [[B(11.5), B(12.35)], [B(40.4), B(41)], [B(46.9), B(47.2)], [B(49.1), B(52)]];                         // breaths before big hits; the logo rings out alone
  const quiet = t => hush.some(([a, b]) => t >= a - 1e-6 && t < b);
  for (let b = 0; b < 52; b++){
    const t = B(b), bar = Math.floor(b / 4), [root, chord] = CH[bar % 4];
    if (b % 4 === 0 && !quiet(t) && bar > 0) cue(t, 'pad', chord);
    if (quiet(t)) continue;
    cue(t, 'kick');
    if (b % 2) cue(t, 'clap');
    if ((b >= 14 && b < 34) || (b >= 35 && b < 45)) [0, 0.5].forEach((x, j) => { const tt = B(b + x); if (!quiet(tt)) cue(tt, 'pluck', chord[(b * 2 + j) % 3] * (j ? 2 : 1)); });   // a little arp gives the loop a tune
    const off = B(b + 0.5); if (!quiet(off)){ cue(off, 'bass', b % 4 === 3 ? root * 2 : root); cue(off, 'hat', b % 4 === 3 ? 'open' : null); }
    [0.25, 0.75].forEach(x => { if (!quiet(B(b + x)) && (b >= 14 && b < 34 || x === 0.75)) cue(B(b + x), 'hat', 'ghost'); });   // 16th ghosts, busier while the wallet plays
  }
  // snare fills into the big cuts
  [[7, 8], [13.25, 14], [34, 35]].forEach(([a, z]) => { const n = Math.round((z - a) * 4); for (let i = 0; i < n; i++) cue(B(a + i / 4), 'snare', 0.1 + 0.25 * i / n); });
  // sub drops on the moments that matter
  [0, 12.35, 14, 35, 49.1].forEach(b => cue(B(b), 'boom', b === 49.1 ? 2.2 : 1.3));
  [B(8)].forEach(t => sfx(t - HIT, 'fastRiser', 0.9));
  cue(B(49.1), 'pad', [220, 262, 330, 440]);
}
startPlayer();
}

/* ---------- 7. player ---------- */
function startPlayer(){
const END = tl.duration();
const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
let last = 0, sched = -1, playing = false;
const LATE = { key:0.05 };                           // typing only: played 50 ms later so each key lands on its letter
tl.eventCallback('onUpdate', () => {
  const now = tl.time();
  applyWallet(now);
  if (playing && ac && now >= last && now - last < 0.35){
    const lat = Math.min(0.25, (ac.outputLatency || 0) + (ac.baseLatency || 0)), until = now + lat + 0.04;
    CUES.forEach(c => { if (c.t > sched && c.t <= until && ON[groupOf(c.type)]) play(c.type, ac.currentTime + Math.max(0, c.t - now - lat + (c.late != null ? c.late : LATE[c.type] || 0)), c.arg); });
    sched = Math.max(sched, until);
  }
  last = now;
  $('#fill').style.width = (now / END * 100) + '%';
  $('#time').textContent = fmt(now) + ' / ' + fmt(END);
});
tl.time(END, false); tl.time(0, false);            // prime every tween before the loop callback exists
applyWallet(0);
tl.eventCallback('onComplete', () => { tl.time(0); last = 0; sched = -0.001; tl.play(); });
const playBtn = $('#play');
function setPlaying(p){ playing = p; playBtn.textContent = p ? 'Pause' : 'Play'; }
playBtn.onclick = () => { ensureAudio(); if (playing){ tl.pause(); setPlaying(false); } else { last = tl.time(); sched = last - 0.001; tl.play(); setPlaying(true); } };
const jump = s => { tl.time(Math.max(0, Math.min(END, s))); last = tl.time(); sched = last - 0.001; };
window.jump = jump;
const rail = $('#rail');
const seek = e => { const r = rail.getBoundingClientRect(); jump(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * END); };
rail.addEventListener('pointerdown', e => { rail.setPointerCapture(e.pointerId); seek(e); rail.onpointermove = seek; });
rail.addEventListener('pointerup', () => { rail.onpointermove = null; });
const fpsSel = $('#fps');
function setFps(v){ gsap.ticker.fps(+v); fpsSel.value = String(v); }
fpsSel.onchange = () => setFps(fpsSel.value);
setFps(CONFIG.fps);
let frames = 0, since = performance.now();
gsap.ticker.add(() => { frames++; const now = performance.now(); if (now - since >= 1000){ $('#meter').textContent = Math.round(frames * 1000 / (now - since)) + ' fps'; frames = 0; since = now; } });
const toggleGroup = k => { ON[k] = !ON[k]; $(k === 'music' ? '#mus' : '#sfx').textContent = (k === 'music' ? 'Music ' : 'SFX ') + (ON[k] ? 'on' : 'off'); ensureAudio(); applyMute(); };
$('#mus').onclick = () => toggleGroup('music');
$('#sfx').onclick = () => toggleGroup('sfx');
function toggleFull(){
  if (document.fullscreenElement) { document.exitFullscreen(); return; }
  if (screen.classList.contains('ffs')) { screen.classList.remove('ffs', 'rot'); setTimeout(fit, 60); return; }
  const fake = () => { screen.classList.add('ffs'); if (W > H && innerHeight > innerWidth) screen.classList.add('rot'); setTimeout(fit, 60); };
  if (screen.requestFullscreen) screen.requestFullscreen().then(() => setTimeout(fit, 60)).catch(fake);
  else fake();
}
$('#fs').onclick = toggleFull;
document.addEventListener('fullscreenchange', () => setTimeout(fit, 60));
CHAPTERS.forEach(c => { const b = document.createElement('button'); b.textContent = fmt(c.t) + ' ' + c.n; b.onclick = () => jump(c.t); $('#chapters').append(b); });
$('#time').textContent = '0:00 / ' + fmt(END);
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = e.key;
  if (k === ' ') { e.preventDefault(); playBtn.click(); }
  else if (k === 'ArrowRight') jump(tl.time() + 1);
  else if (k === 'ArrowLeft') jump(tl.time() - 1);
  else if (k === 'Home') jump(0);
  else if (k === 'f' || k === 'F') toggleFull();
  else if (k === 'm' || k === 'M') toggleGroup('music');
  else if (k === 's' || k === 'S') toggleGroup('sfx');
  else if (k === 'Escape' && screen.classList.contains('ffs')) toggleFull();
});
screen.addEventListener('pointerdown', ensureAudio);
window.CLIP_READY = true;
}
</script>
