<style>
:root{--bg:#0b0b0c;--fg:#f2f5f2;--muted:#9aa19c;--accent:#58f38e;--accent2:#ff3d7f;--card:#1c1d20;--line:#2e3034;
  --font:'Inter Tight','Noto Sans Thai',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%;background:#000;color:var(--fg);font-family:var(--font)}
.player{max-width:1280px;margin:0 auto;padding:16px}
.screen{position:relative;width:100%;margin:0 auto;background:#000;overflow:hidden;border-radius:14px}
.screen.ffs{position:fixed;inset:0;z-index:99;width:auto!important;max-width:none!important;border-radius:0;aspect-ratio:auto!important}
.screen.ffs.rot{inset:auto;left:50%;top:50%;width:100vh!important;height:100vw;transform:translate(-50%,-50%) rotate(90deg)}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--bg);color:var(--fg)}
.scene{position:absolute;inset:0;visibility:hidden;overflow:hidden}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
/* alpha export (scripts/render.js --alpha): every background goes transparent */
html.alpha,html.alpha body,html.alpha .screen,html.alpha .stage,html.alpha .scene{background:transparent!important}
.controls{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-top:12px}
.controls button,.controls select,.chapters button{background:#1c1d20;color:#f2f5f2;border:1px solid #2e3034;border-radius:999px;padding:7px 14px;font:inherit;font-size:14px;cursor:pointer}
.rail{flex:1 1 200px;height:8px;background:#2a2b2f;border-radius:4px;position:relative;cursor:pointer;touch-action:none}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent);border-radius:4px}
#time,#meter{font-variant-numeric:tabular-nums;font-size:14px;color:#f2f5f2}
#meter{color:#9aa19c;min-width:56px}
.chapters{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.hint{margin-top:10px;color:#9aa19c;font-size:12px}
/* smear + RGB split, driven by two CSS variables (no blur filter) */
.fx{--s:0;--r:0;text-shadow:
  calc(var(--s) * -1px) 0 0 color-mix(in srgb, currentColor 40%, transparent),
  calc(var(--s) * -2px) 0 0 color-mix(in srgb, currentColor 22%, transparent),
  calc(var(--s) * -3.2px) 0 0 color-mix(in srgb, currentColor 10%, transparent),
  calc(var(--r) * 1px) 0 0 rgba(255,61,127,.75),
  calc(var(--r) * -1px) 0 0 rgba(61,200,255,.65)}
/* the same glitch "jammed" in brand colours instead of red / cyan (text-fx.md) */
.fxg{--s:0;--r:0;--ga:color-mix(in srgb, var(--accent) 90%, white);--gb:color-mix(in srgb, var(--accent) 45%, black);text-shadow:
  calc(var(--s) * -1px) 0 0 color-mix(in srgb, currentColor 40%, transparent),
  calc(var(--s) * -2px) 0 0 color-mix(in srgb, currentColor 22%, transparent),
  calc(var(--s) * -3.2px) 0 0 color-mix(in srgb, currentColor 10%, transparent),
  calc(var(--r) * 1px) calc(var(--r) * -.3px) 0 var(--ga),
  calc(var(--r) * -1px) calc(var(--r) * .3px) 0 var(--gb)}
/* captions (burned in; also exported as .srt by scripts/render.js) */
/* three looks (CONFIG.ccStyle or ?cc=): box = dark box · clean = white text with a dark edge, no box · bar = brand-colour bar */
#cc{position:absolute;left:0;right:0;z-index:40;display:flex;justify-content:center;pointer-events:none}
#cc span{color:#fff;font-weight:700;line-height:1.25;text-align:center;max-width:86%;text-wrap:balance}
#cc.box span{background:rgba(0,0,0,.72);border-radius:.35em;padding:.18em .55em}
#cc.clean span{font-weight:800;text-shadow:0 0 .12em #000,0 0 .12em #000,0 .06em .3em rgba(0,0,0,.85)}
#cc.bar span{background:var(--accent);color:var(--bg);font-weight:800;border-radius:.2em;padding:.16em .6em}
#cc.off,#cc:empty{display:none}
/* safe-zone overlay: preview only, never rendered */
#safe{position:absolute;inset:0;z-index:60;pointer-events:none;display:none}
#safe i{position:absolute;background:rgba(255,40,80,.28);outline:2px dashed rgba(255,60,90,.9);outline-offset:-2px}
#safe b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;background:rgba(255,40,80,.85);font:700 28px/1.2 system-ui;padding:6px 14px;border-radius:8px}
/* ---- scene styles: sizes are set from JS relative to the frame (M = short side) ---- */
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mask{overflow:hidden;padding:.14em .08em .04em}
.mask>span{display:inline-block}
.word{font-weight:var(--weight,900);line-height:1.05;letter-spacing:var(--track,-.02em)}
.tag{font-weight:500;color:var(--muted)}
.card{position:absolute;border-radius:var(--radius,6%/4.6%);background:var(--card);border:2px solid var(--line);display:flex;flex-direction:column;color:var(--cardfg,var(--fg))}
.card .name{font-weight:700}
.card .price{font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums}
.card ul{list-style:none;padding:0;margin-top:auto}
.card li{display:flex;align-items:center;gap:.5em;font-weight:500}
.card .tk{display:inline-grid;place-items:center;width:1.3em;height:1.3em;border-radius:50%;background:var(--accent);color:var(--bg);font-weight:900;font-size:.8em}
/* ---- Stacko clip v2 ---- */
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;letter-spacing:.06em;font-weight:500}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400;letter-spacing:-.01em}
.serif .it{font-style:italic;color:var(--accent2)}
.anton{font-family:'Anton','Inter Tight',sans-serif;font-weight:400;letter-spacing:.005em;line-height:1;white-space:nowrap;text-transform:uppercase}
.mask{display:inline-block}
#s1{background:radial-gradient(60% 85% at 0% 100%,color-mix(in srgb,#c8f25a 30%,transparent),transparent 70%),radial-gradient(60% 85% at 100% 10%,color-mix(in srgb,var(--accent2) 26%,transparent),transparent 70%),#fbf8fa}
.dots{position:absolute;inset:0;background-image:radial-gradient(color-mix(in srgb,var(--fg) 12%,transparent) 1.6px,transparent 1.8px);background-size:24px 24px}

#nm .ch{background:linear-gradient(180deg,#a4a2ff 0%,#7c78f7 45%,#ff8cc0 100%);-webkit-background-clip:text;background-clip:text;color:transparent}

#spk svg{position:absolute}
#s3b{background:#0b0b0c}
#srt{color:#fff}

.tcard{position:absolute;background:#fff;border:2px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(17,18,20,.08);display:flex;flex-direction:column;justify-content:center;overflow:hidden}

.chip{position:absolute;border-radius:999px;font-weight:800;display:flex;align-items:center;justify-content:center;white-space:nowrap}

.c5{position:absolute;background:#fff;border:2px solid #e3e3ec;border-radius:14px;box-shadow:0 12px 30px rgba(40,40,80,.08);overflow:hidden}

.pw{color:#fff;visibility:hidden}
#s7{background:var(--accent);color:#fff}
#bigRow{display:flex;align-items:center;line-height:.85}
#big3,#bigX{color:#fff;font-weight:900;letter-spacing:-.05em}
#bigSub{color:#fff;font-weight:700}

#s8{background:radial-gradient(80% 90% at 50% 45%,#ffffff,#f2eff4 75%)}
#files{position:absolute;left:0;top:0}
.fmini{position:absolute;background:#fbf7ef;border:2px solid #ebe4d6;border-radius:10px;overflow:hidden}
.fmini i{position:absolute;left:10%;height:7%;border-radius:4px;background:#e8e1d3}
#pcWrap{position:absolute}
.pc{position:absolute;inset:0;background:#fff;border:2px solid var(--line);border-radius:22px;box-shadow:0 30px 80px rgba(17,18,20,.14);color:var(--fg)}
.pc .row{position:absolute;display:flex;align-items:center}
.pc .lab{color:var(--muted);font-weight:700;white-space:nowrap}
.pc .track{position:relative;flex:1;border-radius:999px;background:#f0eef2;overflow:hidden}
.pc .bar{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:999px;background:#c9c6cf;transform-origin:0 50%}
.pc .row.me .bar{background:var(--accent2)}
.pc .row.me .lab{color:var(--fg)}
.pc .val{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
#s9{background:radial-gradient(60% 80% at 50% 50%,#ffffff,#eeeef3 80%)}
.q{color:var(--fg);white-space:nowrap;line-height:1.1;font-style:italic}
.q .mask{padding:.02em .08em .14em}
#q2sub{color:var(--muted);display:inline-block}
.plane{position:absolute;left:0;top:0}
.orb{position:absolute;left:0;top:0;border-radius:50%;border:3px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-weight:900;background:#fff}
#s10{background:radial-gradient(60% 80% at 50% 50%,#ffffff,#eeeef2 85%)}
#ribs{position:absolute;inset:0}
#ribs i{position:absolute;left:0;top:0;background:linear-gradient(90deg,#a7a7b5,#fbfbfd 50%,#9a9aa9);border-radius:4px;box-shadow:0 4px 10px rgba(30,30,60,.22)}
#lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#txt{display:flex;flex-direction:column;align-items:flex-start}
#wm{color:var(--fg)}
#cta{background:var(--accent);color:#fff;font-weight:800;border-radius:999px;display:inline-block}
#flash{position:absolute;inset:0;z-index:30;pointer-events:none;visibility:hidden;background:radial-gradient(circle at 50% 50%,#ffffff 0%,#f4eaff 45%,#ffd3e8 80%,#cfd4ff 100%)}
#brand{position:absolute;left:0;right:0;display:flex;justify-content:center;align-items:center;font-weight:800;color:var(--fg);letter-spacing:-.02em;line-height:1}
#stkFit{position:absolute;inset:0}
#stk{position:absolute;left:50%;top:44%;width:0;height:0}
.sp{position:absolute;left:0;top:0;white-space:nowrap;line-height:1;padding:.12em .42em .1em;font-weight:900;letter-spacing:-.035em;color:#fff}
.sp .t{display:inline-block}
#spSub{position:absolute;left:0;white-space:nowrap;color:var(--fg)}
#zlines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;visibility:hidden;z-index:5;will-change:transform,opacity}
#hookWrap,.sp{will-change:transform}
</style>

<body>
<div class="player">
  <div class="screen" id="screen"><div class="stage" id="stage">
    <!-- 1 · hook: brand types in, trapezoid strips flip / unfold in -->
    <section class="scene" id="s1"><div class="dots"></div><div class="center" id="hookWrap">
      <div id="brand"><svg id="brandMark" viewBox="0 0 200 200"><circle cx="100" cy="100" r="84" fill="none" stroke="var(--accent)" stroke-width="18"/><rect x="68" y="58" width="64" height="22" rx="11" fill="var(--accent2)"/><rect x="56" y="89" width="88" height="22" rx="11" fill="var(--fg)"/><rect x="44" y="120" width="112" height="22" rx="11" fill="var(--fg)"/></svg><span id="brandTxt">Stacko</span></div>
      <div id="stkFit"><div id="stk">
        <div class="sp" id="sp1" style="background:var(--accent2)"><span class="t fx">NOT TOO MUCH</span></div>
        <div class="sp" id="sp2" style="background:#111214"><span class="t fx">JUST</span></div>
        <div class="sp" id="sp3" style="background:#111214"><span class="t fx">EVERYWHERE</span></div>
        <div id="spSub" class="serif">for anyone with <span style="color:var(--accent2)">✱</span> too many apps</div>
      </div></div>
    </div></section>
    <svg id="zlines"></svg>
    <div id="cc"></div>
    <div id="safe"></div>
  </div></div>
  <div class="controls">
    <button id="play">Play</button><span id="time">0:00 / 0:00</span>
    <div class="rail" id="rail"><div class="fill" id="fill"></div></div>
    <select id="fps" aria-label="frame rate">
      <option value="120">120 fps</option><option value="60">60 fps</option><option value="30">30 fps</option><option value="24">24 fps</option>
    </select><span id="meter">– fps</span>
    <button id="mus">Music on</button><button id="sfx">SFX on</button><button id="ccb">CC on</button>
    <select id="safeSel" aria-label="safe zone"><option value="">Safe zone: off</option><option value="all">All platforms</option><option value="tiktok">TikTok</option><option value="reels">IG Reels</option><option value="shorts">YT Shorts</option></select>
    <button id="fs">Fullscreen</button>
  </div>
  <nav class="chapters" id="chapters"></nav>
  <p class="hint">Space play/pause · ←/→ 1 s · Home restart · F fullscreen · M music · S effects · C subtitles · Z safe zone</p>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const qs = new URLSearchParams(location.search);

/* ---------- 1. settings: ask the user first, then fill these in ---------- */
const CONFIG = {
  aspect: '21:9',      // 16:9 | 21:9 | 9:16 | 4:3 | 3:4
  fps: 60,             // 120 | 60 | 30 | 24 (player default; render.js takes its own --fps)
  style: 'light',       // the LOOK: dark | light | poster | pastel — shapes, type and motion feel (references/styles.md)
  brand: {accent:'#4b4ff5', accent2:'#ff3d8b', line:'#e2e1e8', muted:'#6d6b78'},         // brand colours + font from scripts/brand.js (brand.json › looks.<look>); null = the look's own colours
  bpm: null,           // beat grid for B(n); null = the mood's tempo (or the song's, when beats are set). Beat-cut templates cut on beats
  music: null,         // the user's song: 'song.mp3' next to the clip, or a data: URI to keep one file (music becomes the master clock)
  songStart: 0,        // seconds into the song where the clip starts (scripts/beats.js › windows)
  beats: null,         // beat times in the song, from scripts/beats.js (seconds): B(n) then follows the song's own beats, even if the tempo drifts or changes
  bars: null,          // bar starts in the song (beats.js › downbeats): BAR(n) = start of bar n of the clip
  songFade: 0.8,       // the song fades out over the last … seconds of the clip
  bed: 'full',         // null | 'beat' (drums only) | 'full' (drums + bass + chords + lead) — synthesized music (references/sound.md)
  mood: 'drive',       // music mood, picked with the user on card 3: see MOODS below and references/sound.md › Music moods
  captions: true,      // burn captions in; render.js also writes an .srt; the viewer toggles them with the CC button or C
  ccStyle: 'box',      // box | clean | bar (preview another with ?cc=clean)
  ccPos: 'bottom',     // bottom | top — one line can override: caption(t, end, text, {pos:'top'})
  safeZone: ''         // '', 'all', 'tiktok', 'reels', 'shorts' — preview overlay only
};
// music moods: tempo, one chord per bar, drum / bass / chord / lead styles (references/sound.md › Music moods)
const MOODS = {
  drive:     {bpm:120, prog:'Am F C G',             drums:'four',    bass:'off8',   chords:'pad',   lead:null,      swing:0},     // punchy modern promo (default)
  hype:      {bpm:128, prog:'Fm Db Ab Eb',          drums:'four',    bass:'roll',   chords:'pad',   lead:'arp',     swing:0},     // concerts, events, launches
  anthem:    {bpm:100, prog:'C G Am F',             drums:'half',    bass:'long',   chords:'pad',   lead:'chime',   swing:0},     // big, uplifting, stadium
  cinematic: {bpm:90,  prog:'Dm Bb F C',            drums:'boom',    bass:'sub',    chords:'pad',   lead:'chime',   swing:0},     // trailers, reveals, tension
  cafe:      {bpm:92,  prog:'Dm7 G7 Cmaj7 Am7',     drums:'brush',   bass:'walk',   chords:'keys',  lead:null,      swing:0.33},  // restaurants, coffee, jazz
  sunny:     {bpm:112, prog:'C F G C',              drums:'clapfun', bass:'bounce', chords:'soft',  lead:'uke',     swing:0.2},   // happy, fresh food, summer
  cute:      {bpm:118, prog:'F C Dm Bb',            drums:'tiny',    bass:'bounce', chords:'soft',  lead:'marimba', swing:0.2},   // pets, kids, cute things
  lofi:      {bpm:80,  prog:'Fmaj7 Em7 Dm7 Cmaj7',  drums:'lazy',    bass:'long',   chords:'keys',  lead:null,      swing:0.4},   // cosy, calm, study, wellness
  clean:     {bpm:108, prog:'C Am F G',             drums:'soft',    bass:'off8',   chords:'soft',  lead:'arp',     swing:0},     // corporate, SaaS, back-office, trust
  luxe:      {bpm:86,  prog:'Cm9 Abmaj7 Fm9 G7sus', drums:'sparse',  bass:'sub',    chords:'soft',  lead:null,      swing:0}      // premium, beauty, fashion, finance
};
if (qs.get('mood')) { CONFIG.mood = qs.get('mood'); CONFIG.bed = CONFIG.bed || 'full'; }      // ?mood=cute previews any mood on any clip
const MOOD = MOODS[CONFIG.mood] || MOODS.drive;
if (!CONFIG.bpm && !CONFIG.beats) CONFIG.bpm = MOOD.bpm;
const SIZES = { '16:9':[1920,1080], '21:9':[2520,1080], '9:16':[1080,1920], '4:3':[1440,1080], '3:4':[1080,1440] };
const [W, H] = SIZES[qs.get('aspect') || CONFIG.aspect] || SIZES['16:9'];
const M = Math.min(W, H);                      // size everything from the short side so every aspect works
const VERT = H > W;
const px = v => Math.round(v) + 'px';
// beat -> seconds. With the user's song: the song's own beats (from beats.js), shifted so the clip starts at songStart
const BT = CONFIG.beats ? CONFIG.beats.map(t => t - CONFIG.songStart).filter(t => t > -0.02) : null;
if (BT && BT.length > 1 && !CONFIG.bpm) CONFIG.bpm = 60 / ((BT[BT.length - 1] - BT[0]) / (BT.length - 1));
const B = n => {
  if (!BT || BT.length < 2) return n * 60 / CONFIG.bpm;
  const L = BT.length - 1, i = Math.floor(n);
  if (i < 0) return BT[0] + n * (BT[1] - BT[0]);
  if (i >= L) return BT[L] + (n - L) * (BT[L] - BT[L - 1]);
  return BT[i] + (n - i) * (BT[i + 1] - BT[i]);
};
const BAR0 = BT && CONFIG.bars ? Math.max(0, BT.findIndex(t => CONFIG.bars.some(b => Math.abs(b - CONFIG.songStart - t) < 0.03))) : 0;
const BAR = n => B(BAR0 + 4 * n);               // start of bar n (4 beats per bar)

/* ---------- 2. look (shapes, type, motion feel) + brand colours (references/styles.md) ---------- */
// pal = the look's own colours (cardfg = text on cards, when it differs from fg), used when the project has no brand colours. Eases: pop = small things landing,
// enter = pieces arriving, move = camera / whip-pans, out = pieces leaving. Shots use LOOK.* so a look change re-times the feel.
const LOOKS = {
  dark:   {pal:{bg:'#0b0b0c', fg:'#f2f5f2', muted:'#9aa19c', accent:'#58f38e', accent2:'#ff3d7f', card:'#1c1d20', line:'#2e3034'},
           radius:'6%/4.6%', weight:900, track:'-.02em',  pop:'back.out(1.6)', enter:'back.out(1.3)', move:'expo.inOut',   out:'power3.in'},
  light:  {pal:{bg:'#f4f5f2', fg:'#111214', muted:'#6b716d', accent:'#1f5eff', accent2:'#ff4d2e', card:'#ffffff', line:'#dfe2dd'},

tl.fromTo(cta11, {scale:0, autoAlpha:0}, {scale:1, autoAlpha:1, duration:0.35, ease:'back.out(2.4)', transformOrigin:'50% 50%'}, 28.8); shake(R11.hand, 29.05, {amp:0.9});
handheld(R11.hand, 28.5, 31.4, {mode:'idle', amp:0.6});
hudAt(27.8, '11 · IN: SHAPE MASK (star) · SHAKE on the landing · HANDHELD IDLE');
tl.to({}, {duration:0.01}, 31.49);                        // clip length

}
/* ================= end of SHOTS ================= */

/* ---------- 7. build after fonts (and any iframes) are ready, then start the player ---------- */
Promise.all(READY).then(() => { build(); startPlayer(); });

/* ---------- 8. player ---------- */
function startPlayer(){
const END = tl.duration();
if (window.USE_BEAT && !CONFIG.bed) CONFIG.bed = 'beat';                                // older opt-in still works
if (CONFIG.bpm && !CONFIG.music && qs.get('beat') !== '0' && CONFIG.bed) addBed(END);
CUES.sort((a, b) => a.t - b.t);
const fmt = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');
let last = 0, sched = -1, playing = false, ccOn = CONFIG.captions;
const music = CONFIG.music ? Object.assign(new Audio(CONFIG.music), {preload:'auto'}) : null;
const S0 = CONFIG.songStart || 0, songAt = t => t + S0;                  // clip time -> song time
const ccEl = $('#cc'); ccEl.className = qs.get('cc') || CONFIG.ccStyle || 'box'; ccEl.style.fontSize = px(M * (VERT ? 0.042 : 0.036));
const CCPOS = { bottom: VERT ? H * 0.2 : H * 0.07, top: VERT ? H * 0.13 : H * 0.07 };   // clear of TikTok / Reels / Shorts UI in 9:16
function drawCaption(now){
  const c = ccOn ? CAPTIONS.find(c => now >= c.t && now < c.end) : null;
  const html = c ? `<span style="max-width:${VERT ? 76 : 86}%">${c.text}</span>` : '';
  if (c){ const pos = c.pos || CONFIG.ccPos || 'bottom'; ccEl.style.top = pos === 'top' ? px(CCPOS.top) : ''; ccEl.style.bottom = pos === 'top' ? '' : px(CCPOS.bottom); }
  if (ccEl.innerHTML !== html) ccEl.innerHTML = html;
}
function render(now){                                                    // everything that must follow the clock, also while scrubbing
  drawCaption(now);
  if (FOOTAGE.length) syncFootage(now, playing);
  if (window.onClipTime) window.onClipTime(now);
  for (const h of HOOKS) h(now);                                          // transitions, ghosts, handheld camera (section 6b)                          // e.g. applyWallet(now) for real-UI pose drivers
  $('#fill').style.width = (now / END * 100) + '%';
  $('#time').textContent = fmt(now) + ' / ' + fmt(END);
}
GHOSTS.forEach(makeGhosts);                                              // copies for motion blur, made after every tween has its targets
tl.time(END, false); tl.time(0, false);                                  // prime every tween BEFORE the loop callback exists
tl.eventCallback('onUpdate', () => {
  const now = tl.time();
  if (playing && ac && now >= last && now - last < 0.35){           // sound only while playing forward, never while scrubbing
    const lat = Math.min(0.25, (ac.outputLatency || 0) + (ac.baseLatency || 0)), until = now + lat + 0.04;   // schedule ahead so sounds land on their frame
    CUES.forEach(c => { if (c.t > sched && c.t <= until && ON[groupOf(c.type)]) play(c.type, ac.currentTime + Math.max(0, c.t - now - lat + (c.late != null ? c.late : LATE[c.type] || 0)), c.arg); });
    sched = Math.max(sched, until);
  }
  last = now; render(now);
});
render(0);
tl.eventCallback('onComplete', () => { if (window.CLIP_RENDERING) return; tl.time(0); last = 0; sched = -0.001; if (music) music.currentTime = songAt(0); tl.play(); });   // loop (not while scripts render)
const playBtn = $('#play');
function setPlaying(p){ playing = p; playBtn.textContent = p ? 'Pause' : 'Play'; if (FOOTAGE.length) syncFootage(tl.time(), p); }
playBtn.onclick = () => {
  ensureAudio();
  if (playing){ tl.pause(); music && music.pause(); setPlaying(false); }
  else { last = tl.time(); sched = last - 0.001; if (music){ music.currentTime = songAt(tl.time()); music.muted = !ON.music; music.play(); } tl.play(); setPlaying(true); }
};
const jump = s => { tl.time(Math.max(0, Math.min(END, s))); last = tl.time(); sched = last - 0.001; if (music) music.currentTime = songAt(tl.time()); };
const rail = $('#rail');
const seek = e => { const r = rail.getBoundingClientRect(); jump(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * END); };
rail.addEventListener('pointerdown', e => { rail.setPointerCapture(e.pointerId); seek(e); rail.onpointermove = seek; });
rail.addEventListener('pointerup', () => { rail.onpointermove = null; });
const fpsSel = $('#fps');
function setFps(v){ gsap.ticker.fps(+v); fpsSel.value = String(v); }
fpsSel.onchange = () => setFps(fpsSel.value);
setFps(CONFIG.fps);
let frames = 0, since = performance.now();
gsap.ticker.add(() => {
  frames++; const now = performance.now();
  if (now - since >= 1000){ $('#meter').textContent = Math.round(frames * 1000 / (now - since)) + ' fps'; frames = 0; since = now; }
  if (music && playing && Math.abs(music.currentTime - songAt(tl.time())) > 0.08) tl.time(music.currentTime - S0);   // music is the master clock
  if (music) music.volume = Math.max(0, Math.min(1, (END - tl.time()) / (CONFIG.songFade || 0.001)));               // fade out at the end
});
const toggleGroup = k => { ON[k] = !ON[k]; $(k === 'music' ? '#mus' : '#sfx').textContent = (k === 'music' ? 'Music ' : 'SFX ') + (ON[k] ? 'on' : 'off'); if (music && k === 'music') music.muted = !ON.music; ensureAudio(); applyMute(); };
$('#mus').onclick = () => toggleGroup('music'); $('#sfx').onclick = () => toggleGroup('sfx');
const toggleCC = () => { ccOn = !ccOn; $('#ccb').textContent = ccOn ? 'CC on' : 'CC off'; drawCaption(tl.time()); };
$('#ccb').onclick = toggleCC; $('#ccb').textContent = ccOn ? 'CC on' : 'CC off'; $('#ccb').hidden = !CAPTIONS.length;   // only when the clip has captions
/* safe zones for 1080x1920 (approximate, platforms change their UI: check before posting) */
const SAFE = { tiktok:{t:108, b:320, l:60, r:120}, reels:{t:210, b:310, l:0, r:84}, shorts:{t:120, b:300, l:0, r:96} };
function setSafe(v){
  const el = $('#safe'); $('#safeSel').value = v; el.innerHTML = ''; el.style.display = v ? 'block' : 'none';
  if (!v) return;
  if (!VERT){ el.innerHTML = `<i style="left:0;top:0;right:0;height:${px(H * 0.05)}"></i><i style="left:0;bottom:0;right:0;height:${px(H * 0.05)}"></i><i style="left:0;top:0;bottom:0;width:${px(W * 0.05)}"></i><i style="right:0;top:0;bottom:0;width:${px(W * 0.05)}"></i><b>Title-safe 90%</b>`; return; }
  const k = W / 1080, z = v === 'all' ? {t:210, b:320, l:60, r:120} : SAFE[v];
  el.innerHTML = `<i style="left:0;top:0;right:0;height:${px(z.t * k)}"></i><i style="left:0;bottom:0;right:0;height:${px(z.b * k)}"></i>
    ${z.l ? `<i style="left:0;top:${px(z.t * k)};bottom:${px(z.b * k)};width:${px(z.l * k)}"></i>` : ''}<i style="right:0;top:${px(z.t * k)};bottom:${px(z.b * k)};width:${px(z.r * k)}"></i>
    <b>${({all:'All platforms', tiktok:'TikTok', reels:'IG Reels', shorts:'YT Shorts'})[v]} UI</b>`;
}
$('#safeSel').onchange = e => setSafe(e.target.value);
setSafe(qs.get('safe') ?? CONFIG.safeZone);
function toggleFull(){
  if (document.fullscreenElement) { document.exitFullscreen(); return; }
  if (screen.classList.contains('ffs')) { screen.classList.remove('ffs', 'rot'); setTimeout(fit, 60); return; }
  const fake = () => { screen.classList.add('ffs'); if (W > H && innerHeight > innerWidth) screen.classList.add('rot'); setTimeout(fit, 60); };
  if (screen.requestFullscreen) screen.requestFullscreen().then(() => setTimeout(fit, 60)).catch(fake);
  else fake();                                                           // iPhone: fake fullscreen, rotates landscape clips
}
$('#fs').onclick = toggleFull;
document.addEventListener('fullscreenchange', () => setTimeout(fit, 60));
CHAPTERS.forEach(c => { const b = document.createElement('button'); b.textContent = fmt(c.t) + ' ' + c.n; b.onclick = () => jump(c.t); $('#chapters').append(b); });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  const k = e.key;
  if (k === ' ') { e.preventDefault(); playBtn.click(); }
  else if (k === 'ArrowRight') jump(tl.time() + 1);
  else if (k === 'ArrowLeft') jump(tl.time() - 1);
  else if (k === 'Home') jump(0);
  else if (k === 'f' || k === 'F') toggleFull();
  else if (k === 'm' || k === 'M') toggleGroup('music');
  else if (k === 's' || k === 'S') toggleGroup('sfx');
  else if (k === 'c' || k === 'C') toggleCC();
  else if (k === 'z' || k === 'Z') { const o = ['', 'all', 'tiktok', 'reels', 'shorts']; setSafe(o[(o.indexOf($('#safeSel').value) + 1) % o.length]); }
  else if (k === 'Escape' && screen.classList.contains('ffs')) toggleFull();
});
screen.addEventListener('pointerdown', ensureAudio);

/* ---------- 9. API for scripts/check.js and scripts/render.js ---------- */
async function renderAudio(sampleRate = 48000){                          // offline mix of every cue (+ music) -> [left, right]
  const len = Math.ceil((END + 0.6) * sampleRate), off = new OfflineAudioContext(2, len, sampleRate), live = [ac, bus, verb, NB, GR];
  useCtx(off);                                                           // same bus + synths; the mute buttons don't apply to exports
  try {
    CUES.forEach(c => play(c.type, c.t + 0.001, c.arg));
    const bytes = u => fetch(u).then(r => r.arrayBuffer()).catch(() => new Promise((ok, no) => {   // file:// pages can't fetch(); XHR can (render.js allows file access)
      const x = new XMLHttpRequest(); x.open('GET', u); x.responseType = 'arraybuffer'; x.onload = () => x.response ? ok(x.response) : no(new Error('could not read ' + u)); x.onerror = () => no(new Error('could not read ' + u)); x.send(); }));
    if (music){ const buf = await off.decodeAudioData(await bytes(CONFIG.music)), s = off.createBufferSource(), g = off.createGain(), f = CONFIG.songFade || 0;
      s.buffer = buf; s.connect(g); g.connect(off.destination); s.start(0, S0); s.stop(END + 0.05);
      if (f){ g.gain.setValueAtTime(1, Math.max(0, END - f)); g.gain.linearRampToValueAtTime(0, END); } }
  } finally { [ac, bus, verb, NB, GR] = live; }
  const r = await off.startRendering();
  return [r.getChannelData(0), r.getChannelData(1)];
}
window.CLIP = { tl, W, H, END, CHAPTERS, CAPTIONS, CUES, BT, FOOTAGE, setSafe, renderAudio, seek:t => { tl.time(t, false); render(t); }, settle:settleFootage, ready:!FOOTAGE.length };
if (FOOTAGE.length) Promise.all(FOOTAGE.map(f => f.ready)).then(() => { render(tl.time()); CLIP.ready = true; });   // check / render wait for the videos
}
</script>
